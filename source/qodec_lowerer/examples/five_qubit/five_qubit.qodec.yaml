# Five-qubit [[5,1,3]] perfect code — single-file qodec bundle.
#
# The smallest code that corrects an arbitrary single-qubit error (Laflamme,
# Miquel, Paz, Zurek 1996). Unlike every other example in this catalog it is a
# *non-CSS* code: each of its four stabilizers mixes X and Z on the same
# support (the cyclic generator XZZXI and its three cyclic shifts). This makes
# it a good stress test for the Pauli algebra and for non-CSS syndrome
# extraction (each stabilizer is measured with a single ancilla using a mix of
# controlled-X and controlled-Z couplings).
#
# Because no stabilizer is supported in a single Pauli basis, a destructive
# single-basis logical measurement yields the logical operator but *no*
# stabilizer checks — a characteristic feature of non-CSS codes.
#
# Its other distinctive feature is a transversal logical gate: the code's ONLY
# transversal single-qubit Clifford is the order-3 "Pauli cycler" (physical H then
# S on all five qubits), which permutes the logical Paulis X -> Z -> Y -> X.
# Transversal H or S *individually* do not preserve the code — only their order-3
# product does — so unlike the Steane code (full transversal Clifford group) the
# five-qubit code's transversal single-qubit gates form just the cyclic group of
# order 3.
#
# Reference: R. Laflamme, C. Miquel, J. P. Paz, W. H. Zurek, "Perfect quantum
# error correction code," Phys. Rev. Lett. 77, 198 (1996).
---
qodec.yaml:
  name: five_qubit
  description: >-
    The [[5,1,3]] perfect code — the smallest distance-3 code, the catalog's only
    non-CSS example (stabilizers mix X and Z on a shared support), with a
    transversal order-3 Clifford (cycle) as its sole transversal single-qubit gate.
  layers:
    - instruction_set: five_qubit.isa.yaml
      codes:
        five_qubit: five_qubit.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        idle: idle.gadget.yaml
        cycle: cycle.gadget.yaml
        measure_z: measure_z.gadget.yaml
        measure_x: measure_x.gadget.yaml
    - instruction_set: ../stim.isa.yaml
---
five_qubit.isa.yaml:
  name: five_qubit
  description: Logical instruction set for the [[5,1,3]] perfect code (one logical qubit).
  blocks: { five_qubit: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state (reset + stabilizer projection).
      out: [five_qubit]
      action: [stabilize: Z_0]
    - mnemonic: idle
      description: One syndrome-extraction round (identity logical action).
      in: [five_qubit]
      out: [five_qubit]
    - mnemonic: cycle
      description: >-
        Transversal order-3 Clifford — the five-qubit code's only transversal
        single-qubit gate. Physical H then S on every qubit cyclically permutes
        the logical Paulis (X -> Z -> Y -> X).
      in: [five_qubit]
      out: [five_qubit]
      action: [clifford: { X_0: Z_0, Z_0: Y_0 }]
    - mnemonic: measure_z
      description: Destructive measurement of the logical Z observable.
      in: [five_qubit]
      action: [observe: Z_0]
    - mnemonic: measure_x
      description: Destructive measurement of the logical X observable.
      in: [five_qubit]
      action: [observe: X_0]
---
five_qubit.code.yaml:
  name: five_qubit
  description: >-
    The [[5,1,3]] perfect code. Four non-CSS stabilizers (cyclic shifts of
    XZZXI). Logical X = X_0 X_1 X_2 X_3 X_4, logical Z = Z_0 Z_1 Z_2 Z_3 Z_4.
  stabilizers:
    - X_0 Z_1 Z_2 X_3
    - X_1 Z_2 Z_3 X_4
    - X_0 X_2 Z_3 Z_4
    - Z_0 X_1 X_3 Z_4
  x: [X_0 X_1 X_2 X_3 X_4]
  z: [Z_0 Z_1 Z_2 Z_3 Z_4]
---
# Prepare |0_L> by measurement: reset all data to |0> (which fixes logical Z to
# +1), then project into the codespace by measuring all four stabilizers. The
# measured signs seed the outgoing stabilizer frame (a decoder applies the
# implied Pauli correction). Ancilla 5-8 carry the four non-CSS measurements.
prepare_z.gadget.yaml:
  circuit:
    source:
      - R: [0]
      - R: [1]
      - R: [2]
      - R: [3]
      - R: [4]
      - R: [5]
      - R: [6]
      - R: [7]
      - R: [8]
      - H: [5]
      - H: [6]
      - H: [7]
      - H: [8]
      - CX: [5, 0]
      - CZ: [5, 1]
      - CZ: [5, 2]
      - CX: [5, 3]
      - CX: [6, 1]
      - CZ: [6, 2]
      - CZ: [6, 3]
      - CX: [6, 4]
      - CX: [7, 0]
      - CX: [7, 2]
      - CZ: [7, 3]
      - CZ: [7, 4]
      - CZ: [8, 0]
      - CX: [8, 1]
      - CX: [8, 3]
      - CZ: [8, 4]
      - H: [5]
      - H: [6]
      - H: [7]
      - H: [8]
      - M: [5]
      - M: [6]
      - M: [7]
      - M: [8]
  checks:
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[2]"]
    - ["circuit.readouts[3]", "out[0].stabilizers[3]"]
---
# One syndrome-extraction round. Each non-CSS stabilizer is measured with one
# ancilla in |+>, coupling controlled-X to its X-support and controlled-Z to
# its Z-support, then read out in the X basis. readouts[0..3] are stabilizers
# 0..3 in code order.
idle.gadget.yaml:
  circuit:
    source:
      - R: [5]
      - R: [6]
      - R: [7]
      - R: [8]
      - H: [5]
      - H: [6]
      - H: [7]
      - H: [8]
      - CX: [5, 0]
      - CZ: [5, 1]
      - CZ: [5, 2]
      - CX: [5, 3]
      - CX: [6, 1]
      - CZ: [6, 2]
      - CZ: [6, 3]
      - CX: [6, 4]
      - CX: [7, 0]
      - CX: [7, 2]
      - CZ: [7, 3]
      - CZ: [7, 4]
      - CZ: [8, 0]
      - CX: [8, 1]
      - CX: [8, 3]
      - CZ: [8, 4]
      - H: [5]
      - H: [6]
      - H: [7]
      - H: [8]
      - M: [5]
      - M: [6]
      - M: [7]
      - M: [8]
  checks:
    - ["circuit.readouts[0]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "in[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "in[0].stabilizers[2]"]
    - ["circuit.readouts[3]", "in[0].stabilizers[3]"]
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[2]"]
    - ["circuit.readouts[3]", "out[0].stabilizers[3]"]
---
# cycle: the transversal order-3 Clifford gate. Physical H then S on all five data
# qubits realizes the logical Pauli cycle X -> Z -> Y -> X. The gate permutes the
# (non-CSS) stabilizer group among itself; each check ties an incoming stabilizer
# to the product of outgoing stabilizers its image decomposes into.
cycle.gadget.yaml:
  circuit:
    source:
      - H: [0]
      - H: [1]
      - H: [2]
      - H: [3]
      - H: [4]
      - S: [0]
      - S: [1]
      - S: [2]
      - S: [3]
      - S: [4]
  checks:
    - [
        "in[0].stabilizers[0]",
        "out[0].stabilizers[0]",
        "out[0].stabilizers[2]",
        "out[0].stabilizers[3]",
      ]
    - ["in[0].stabilizers[1]", "out[0].stabilizers[0]", "out[0].stabilizers[2]"]
    - ["in[0].stabilizers[2]", "out[0].stabilizers[1]", "out[0].stabilizers[3]"]
    - [
        "in[0].stabilizers[3]",
        "out[0].stabilizers[0]",
        "out[0].stabilizers[1]",
        "out[0].stabilizers[3]",
      ]
---
# Destructive logical-Z readout (logical Z = Z_0…Z_4). No stabilizer is
# supported purely in the Z basis, so a single-basis measurement yields no
# stabilizer checks — characteristic of a non-CSS code.
measure_z.gadget.yaml:
  circuit:
    source:
      - M: [0]
      - M: [1]
      - M: [2]
      - M: [3]
      - M: [4]
  readouts:
    - ["circuit.readouts[0:5]", "in[0].z[0]"]
---
# Destructive logical-X readout (logical X = X_0…X_4). Likewise no checks.
measure_x.gadget.yaml:
  circuit:
    source:
      - MX: [0]
      - MX: [1]
      - MX: [2]
      - MX: [3]
      - MX: [4]
  readouts:
    - ["circuit.readouts[0:5]", "in[0].x[0]"]
