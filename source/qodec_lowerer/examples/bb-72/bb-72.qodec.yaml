# Bivariate Bicycle [[72,12,6]] qLDPC code — single-file qodec bundle (generated).
#
# A high-rate quantum LDPC code (S. Bravyi, A. Cross, J. Gambetta, D. Maslov,
# P. Rall, T. Yoder, "High-threshold and low-overhead fault-tolerant quantum
# memory," Nature 627, 778-782, 2024; arXiv:2308.07915). Unlike the surface code's
# one-logical-qubit-per-patch overhead, a BB code packs a whole REGISTER of logical
# qubits into ONE block with weight-6 checks that are NOT geometrically local.
#
# QC(A,B) with x = S_l (x) I_m, y = I_l (x) S_m, A = A1+A2+A3, B = B1+B2+B3 has
# n = 2lm data qubits (left + right registers) and CSS checks H_X = [A|B],
# H_Z = [B^T|A^T]; X- and Z-checks commute since AB = BA. This is the smallest named
# example (Table 3): [[72,12,6]] with l=m=6, A = x^3+y+y^2, B = y^3+x+x^2 — 36
# weight-6 X-checks, 36 weight-6 Z-checks, 12 logical qubits.
#
# The checks were built and verified offline (all commute, k=12); the 12 logical X
# / 12 logical Z operators come from GF(2) nullspaces. The code
# DISTANCE (6) is cited from the paper (a minimum-weight search); the catalog
# validates structure and algebra, not distance.
#
# This bundle is a 12-logical-qubit memory experiment. It exercises qodec at qLDPC
# scale: a single block type carrying 12 logical qubits, a long non-local stabilizer
# list, and a syndrome round that measures all 72 checks. The paper's optimized
# depth-7 schedule is replaced by the catalog's uniform ancilla extraction.
#
# Reference: S. Bravyi, A. W. Cross, J. M. Gambetta, D. Maslov, P. Rall, T. J.
# Yoder, "High-threshold and low-overhead fault-tolerant quantum memory,"
# Nature 627, 778-782 (2024).
---
qodec.yaml:
  name: bb-72
  description: >-
    The [[72,12,6]] bivariate-bicycle qLDPC code (Bravyi et al. 2024): 12 logical
    qubits in one block with weight-6 non-local checks. A high-rate memory
    experiment — prepare, one syndrome round, destructive readout.
  layers:
    - instruction_set: bb72.isa.yaml
      codes:
        bb72: bb72.code.yaml
      gadgets:
        prepare_z_all: prepare_z_all.gadget.yaml
        prepare_x_all: prepare_x_all.gadget.yaml
        idle: idle.gadget.yaml
        measure_z_all: measure_z_all.gadget.yaml
        measure_x_all: measure_x_all.gadget.yaml
    - instruction_set: ../stim.isa.yaml
---
bb72.isa.yaml:
  name: bb72
  description: >-
    Logical instruction set for the [[72,12,6]] bivariate-bicycle code. One block
    type carries all 12 logical qubits.
  blocks: { bb72: 12 }
  instructions:
    - mnemonic: prepare_z_all
      description: Prepare all 12 logical qubits in |0>.
      out: [bb72]
      action:
        [
          stabilize:
            [Z_0, Z_1, Z_2, Z_3, Z_4, Z_5, Z_6, Z_7, Z_8, Z_9, Z_10, Z_11],
        ]
    - mnemonic: prepare_x_all
      description: Prepare all 12 logical qubits in |+>.
      out: [bb72]
      action:
        [
          stabilize:
            [X_0, X_1, X_2, X_3, X_4, X_5, X_6, X_7, X_8, X_9, X_10, X_11],
        ]
    - mnemonic: idle
      description: One full syndrome-extraction round (identity logical action).
      in: [bb72]
      out: [bb72]
    - mnemonic: measure_z_all
      description: Destructive measurement of all 12 logical Z observables.
      in: [bb72]
      action:
        [
          observe:
            [Z_0, Z_1, Z_2, Z_3, Z_4, Z_5, Z_6, Z_7, Z_8, Z_9, Z_10, Z_11],
        ]
    - mnemonic: measure_x_all
      description: Destructive measurement of all 12 logical X observables.
      in: [bb72]
      action:
        [
          observe:
            [X_0, X_1, X_2, X_3, X_4, X_5, X_6, X_7, X_8, X_9, X_10, X_11],
        ]
---
