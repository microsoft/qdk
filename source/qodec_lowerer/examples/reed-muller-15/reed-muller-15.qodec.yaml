# Reed-Muller [[15,1,3]] code — single-file qodec bundle (generated).
#
# The smallest stabilizer code with a transversal non-Clifford gate: applying a
# physical T-dagger to every one of the 15 qubits realizes a logical T. This is the
# code at the heart of 15-to-1 magic state distillation (Bravyi-Kitaev 2005): the
# 15-to-1 protocol is the *program* `prepare_x; t; idle (post-select on a trivial
# syndrome)` over this code, whose surviving logical qubit is a distilled |T>.
#
# Qubit q (0-indexed) carries binary label q+1. Four weight-8 X-stabilizers (the
# coordinate functions) and ten weight-4 Z-stabilizers; logical X is a weight-7
# face (X_1 X_3 ... X_13), logical Z a weight-3 edge (Z_0 Z_1 Z_2). The stabilizers
# were derived and verified offline: commutation,
# logical anticommutation, AND triorthogonality (every X-stabilizer codeword has
# weight divisible by 8 and meets the logical-X support in a multiple of 4 qubits).
# Triorthogonality is what makes a physical T-dagger on all 15 qubits act as
# EXACTLY logical T. qodec's loader re-checks the commutation.
#
# Reference: [[15,1,3]] quantum Reed-Muller / tetrahedral colour code; E. Knill,
# R. Laflamme, W. Zurek (1996); A. Steane, "Quantum Reed-Muller Codes" (1996);
# S. Bravyi, A. Kitaev, Phys. Rev. A 71, 022316 (2005).
---
qodec.yaml:
  name: reed-muller-15
  description: >-
    The [[15,1,3]] quantum Reed-Muller code — the smallest code with a transversal
    T gate (physical T-dagger on all 15 qubits = logical T), the substrate of
    15-to-1 magic state distillation.
  layers:
    - instruction_set: reed_muller_15.isa.yaml
      codes:
        rm15: reed_muller_15.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        prepare_x: prepare_x.gadget.yaml
        idle: idle.gadget.yaml
        t: t.gadget.yaml
        measure_z: measure_z.gadget.yaml
        measure_x: measure_x.gadget.yaml
    - instruction_set: stim_t.isa.yaml
---
reed_muller_15.isa.yaml:
  name: reed_muller_15
  description: Logical instruction set for the [[15,1,3]] Reed-Muller code.
  blocks: { rm15: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [rm15]
      action: [stabilize: Z_0]
    - mnemonic: prepare_x
      description: Prepare the logical |+> state.
      out: [rm15]
      action: [stabilize: X_0]
    - mnemonic: idle
      description: One full syndrome-extraction round (identity logical action).
      in: [rm15]
      out: [rm15]
    - mnemonic: t
      description: >-
        Logical T = exp(-i pi/8 Z). Realized transversally by a physical T-dagger
        on every qubit (the defining non-Clifford gate of this code).
      in: [rm15]
      out: [rm15]
      action: [rotate: { pauli: Z_0, angle: 0.7853981633974483 }]
    - mnemonic: measure_z
      description: Destructive measurement of the logical Z observable.
      in: [rm15]
      action: [observe: Z_0]
    - mnemonic: measure_x
      description: Destructive measurement of the logical X observable.
      in: [rm15]
      action: [observe: X_0]
---
stim_t.isa.yaml:
  name: stim_t
  description: Stim Clifford set plus T-dagger (for the transversal logical T).
  blocks: { qubit: 1 }
  instructions:
    - mnemonic: R
      description: Reset to |0>.
      out: [qubit]
      action: [stabilize: Z_0]
    - mnemonic: H
      description: Hadamard.
      in: [qubit]
      out: [qubit]
      action: [clifford: { X_0: Z_0, Z_0: X_0 }]
    - mnemonic: CX
      description: Controlled-X (CNOT).
      in: [qubit, qubit]
      out: [qubit, qubit]
      action: [clifford: { X_0: X_0 X_1, Z_1: Z_0 Z_1 }]
    - mnemonic: M
      description: Destructive Z-basis measurement.
      in: [qubit]
      action: [observe: Z_0]
    - mnemonic: MX
      description: Destructive X-basis measurement.
      in: [qubit]
      action: [observe: X_0]
    - mnemonic: Tdg
      description: T-dagger = exp(+i pi/8 Z); transversally this is logical T.
      in: [qubit]
      out: [qubit]
      action: [rotate: { pauli: Z_0, angle: -0.7853981633974483 }]
---
reed_muller_15.code.yaml:
  name: rm15
  description: >-
    [[15,1,3]] Reed-Muller code. Stabilizers 0-3 are the weight-8 X coordinate
    functions; 4-13 are weight-4 Z faces. Logical X = X_1 X_3 X_5 X_7 X_9 X_11 X_13
    (weight 7), logical Z = Z_0 Z_1 Z_2 (weight 3).
  stabilizers:
    - X_0 X_2 X_4 X_6 X_8 X_10 X_12 X_14
    - X_1 X_2 X_5 X_6 X_9 X_10 X_13 X_14
    - X_3 X_4 X_5 X_6 X_11 X_12 X_13 X_14
    - X_7 X_8 X_9 X_10 X_11 X_12 X_13 X_14
    - Z_0 Z_1 Z_3 Z_6
    - Z_0 Z_1 Z_4 Z_5
    - Z_0 Z_1 Z_7 Z_10
    - Z_0 Z_1 Z_8 Z_9
    - Z_0 Z_1 Z_11 Z_14
    - Z_0 Z_1 Z_12 Z_13
    - Z_0 Z_2 Z_3 Z_5
    - Z_0 Z_2 Z_7 Z_9
    - Z_0 Z_2 Z_11 Z_13
    - Z_0 Z_3 Z_7 Z_12
  x: [X_1 X_3 X_5 X_7 X_9 X_11 X_13]
  z: [Z_0 Z_1 Z_2]
---
