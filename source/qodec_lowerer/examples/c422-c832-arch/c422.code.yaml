name: C422
description: |
  [[4,2,2]] 2D color code (smallest interesting color code; Campbell 2016).
  4 physical qubits, 2 logical qubits, distance 2 (error-detecting).
  Hosts a transversal Hadamard, used in the Nelson-Landahl-Baczewski
  architecture (arXiv:2507.20387) for logical H operations.

stabilizers:
  - "X_0 X_1 X_2 X_3"
  - "Z_0 Z_1 Z_2 Z_3"

x:
  - "X_0 X_1"
  - "X_1 X_3"
z:
  - "Z_0 Z_2"
  - "Z_2 Z_3"
