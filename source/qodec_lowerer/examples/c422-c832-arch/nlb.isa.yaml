name: NLB
description: |
  Universal logical gate set for the Nelson-Landahl-Baczewski architecture
  (arXiv:2507.20387). Two block types coexist at the logical level:

    c422 — a [[4,2,2]] 2D-color-code block carrying 2 logical qubits.
           Hosts transversal H.

    c832 — an [[8,3,2]] 3D-color-code block carrying 3 logical qubits.
           Hosts transversal CCZ.

  Logical state is shuttled between block types via the ``teleport_*``
  primitives so that whichever block currently holds a qubit is the one
  that natively realises the next logical gate. Together with single-qubit
  X/Z preparation and measurement on either code, this set is universal
  for fault-tolerant quantum computation.
blocks: { c422: 2, c832: 3 }
instructions:
  - mnemonic: prepare_z_all_c422
    description: Prepare a c422 block in |00⟩ (Z_0=+1, Z_1=+1).
    out: [c422]
    action:
      - stabilize:
          - Z_0
          - Z_1
    flags: [reject]
  - mnemonic: prepare_x_all_c422
    description: Prepare a c422 block in |++⟩ (X_0=+1, X_1=+1).
    out: [c422]
    action:
      - stabilize:
          - X_0
          - X_1
    flags: [reject]
  - mnemonic: prepare_z_all_c832
    description: |
      Prepare a c832 block in |000⟩ (all three Z_i=+1). The current
      gadget realising this is non-fault-tolerant (no verifier ancilla),
      so the instruction does not advertise a `reject` flag.
    out: [c832]
    action:
      - stabilize:
          - Z_0
          - Z_1
          - Z_2
  - mnemonic: prepare_x_all_c832
    description: |
      Prepare a c832 block in |+++⟩ (all three X_i=+1). Realised by
      preparing |+⟩⊗⁸ (which is +1 on every X-Pauli, including the X⊗8
      stabiliser and all three X_i logicals) and post-selecting on the
      four Z-face stabilisers being +1. The post-selection is exposed
      through four `reject_i` flags (one per Z-face stabiliser).
    out: [c832]
    action:
      - stabilize:
          - X_0
          - X_1
          - X_2
    flags: [reject_0, reject_1, reject_2, reject_3]
  - mnemonic: measure_z_all_c422
    description: Destructive Z_0, Z_1 measurement of a c422 block.
    in: [c422]
    action:
      - observe:
          - Z_0
          - Z_1
  - mnemonic: measure_x_all_c422
    description: Destructive X_0, X_1 measurement of a c422 block.
    in: [c422]
    action:
      - observe:
          - X_0
          - X_1
  - mnemonic: measure_z_all_c832
    description: Destructive Z_0, Z_1, Z_2 measurement of a c832 block.
    in: [c832]
    action:
      - observe:
          - Z_0
          - Z_1
          - Z_2
  - mnemonic: measure_x_all_c832
    description: Destructive X_0, X_1, X_2 measurement of a c832 block.
    in: [c832]
    action:
      - observe:
          - X_0
          - X_1
          - X_2
  - mnemonic: h_all_c422
    description: |
      Transversal physical Hadamard on a c422 block. In the Knill
      convention used here (X_0=X_0X_1, X_1=X_1X_3, Z_0=Z_0Z_2,
      Z_1=Z_2Z_3), transversal H on the four physical qubits
      implements (H ⊗ H) followed by a logical SWAP — concretely
      X_0 ↔ Z_1 and X_1 ↔ Z_0. (A label-preserving H ⊗ H is
      mathematically impossible on [[4,2,2]]: same-qubit X_i and Z_i
      with identical support would commute.)
    in: [c422]
    out: [c422]
    action:
      - clifford:
          X_0: Z_1
          Z_0: X_1
          X_1: Z_0
          Z_1: X_0
  - mnemonic: ccz_c832
    description: |
      Transversal CCZ across the three logical qubits of a c832 block.
      CCZ = exp(iπ Π_{|111⟩}) on the logical Z-axes; expanding the
      projector gives a product of seven commuting Z-axis Pauli
      rotations of angle ±π/4.
    in: [c832]
    out: [c832]
    action:
      - rotate:
          pauli: Z_0
          angle: 0.7853981633974483
      - rotate:
          pauli: Z_1
          angle: 0.7853981633974483
      - rotate:
          pauli: Z_2
          angle: 0.7853981633974483
      - rotate:
          pauli: Z_0 Z_1
          angle: -0.7853981633974483
      - rotate:
          pauli: Z_0 Z_2
          angle: -0.7853981633974483
      - rotate:
          pauli: Z_1 Z_2
          angle: -0.7853981633974483
      - rotate:
          pauli: Z_0 Z_1 Z_2
          angle: 0.7853981633974483
  - mnemonic: teleport_c832_to_c422
    description: |
      X-type Knill teleport of c832 logical qubits {0,1} onto a fresh
      c422 block (logical qubits {0,1} of dest). Source c832 logical
      qubit 2 is left untouched; source logical qubits 0,1 end in
      |+⟩|+⟩ (M_X-projected),
      ready for a subsequent Z-type teleport back. Emits two classical
      Pauli-frame bits a0=⟨X_0⟩, a1=⟨X_1⟩ that the user must absorb
      into the dest Z-frame (the action declares the corrections
      explicitly so a stabilizer simulator can track them).
    in: [c832]
    out: [c832, c422]
    action:
      - stabilize:
          - Z_3
          - Z_4
      - clifford:
          X_0: X_3
          Z_0: Z_3
          X_1: X_4
          Z_1: Z_4
      - observe:
          - X_0
          - X_1
      - stabilize:
          - X_0
          - X_1
  - mnemonic: teleport_c422_to_c832
    description: |
      Z-type Knill teleport of a c422 block onto logical qubits {0,1} of
      a fresh c832 block. Dest c832 logical qubit 2 is initialised in |+⟩ (so the third
      transversal CX has no effect on it); source c422 ends in |0⟩|0⟩
      (M_Z-projected). Emits two classical Pauli-frame bits
      b0=⟨Z_0⟩, b1=⟨Z_1⟩ that the user must absorb into the dest
      X-frame.
    in: [c422]
    out: [c422, c832]
    action:
      - stabilize:
          - X_2
          - X_3
          - X_4
      - clifford:
          X_0: X_2
          Z_0: Z_2
          X_1: X_3
          Z_1: Z_3
      - observe:
          - Z_0
          - Z_1
      - stabilize:
          - Z_0
          - Z_1
    flags: [reject_0, reject_1, reject_2, reject_3]
