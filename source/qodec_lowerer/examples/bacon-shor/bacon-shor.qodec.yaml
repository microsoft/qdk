# Bacon-Shor [[9,1,3]] subsystem code — single-file qodec bundle.
#
# A subsystem code on a 3×3 grid (Bacon 2006). Its defining feature is that the
# weight-6 stabilizers are never measured directly: instead one measures the
# weight-2 *gauge* operators (XX on horizontal neighbours, ZZ on vertical
# neighbours) and reconstructs each stabilizer as a product of gauge outcomes.
# This bundle demonstrates exactly that — the `idle` gadget measures the twelve
# weight-2 gauge operators and the `checks` XOR the relevant gauge readouts to
# recover each weight-6 stabilizer.
#
# NOTE ON THE MODEL: qodec's code artifact has no gauge-operator field, so
# `bacon_shor.code.yaml` lists only the four *bare* stabilizers (the centre of
# the gauge group). The gauge group itself — the thing that makes this a
# subsystem code and enables the low-weight extraction — lives only in the
# gadget circuit.
#
# Reference: D. Bacon, "Operator quantum error-correcting subsystems for
# self-correcting quantum memories," Phys. Rev. A 73, 012340 (2006).
---
qodec.yaml:
  name: bacon-shor
  description: >-
    The Bacon-Shor [[9,1,3]] subsystem code. Weight-2 gauge operators are
    measured and XOR-combined into the weight-6 stabilizers (gauge syndrome
    extraction). The bare stabilizers are stored; the gauge group lives in the
      gadget.
  layers:
    - instruction_set: bacon_shor.isa.yaml
      codes:
        bacon_shor: bacon_shor.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        idle: idle.gadget.yaml
        measure_z: measure_z.gadget.yaml
        measure_x: measure_x.gadget.yaml
    - instruction_set: ../stim.isa.yaml
---
bacon_shor.isa.yaml:
  name: bacon_shor
  description: Logical instruction set for the Bacon-Shor [[9,1,3]] subsystem code.
  blocks: { bacon_shor: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [bacon_shor]
      action: [stabilize: Z_0]
    - mnemonic: idle
      description: One gauge syndrome-extraction round (identity logical action).
      in: [bacon_shor]
      out: [bacon_shor]
    - mnemonic: measure_z
      description: Destructive measurement of the logical Z observable.
      in: [bacon_shor]
      action: [observe: Z_0]
    - mnemonic: measure_x
      description: Destructive measurement of the logical X observable.
      in: [bacon_shor]
      action: [observe: X_0]
---
bacon_shor.code.yaml:
  name: bacon_shor
  description: >-
    Bare stabilizers of the Bacon-Shor [[9,1,3]] code on a 3×3 grid. Stabilizers
    0-1 are the weight-6 X products (adjacent column pairs); 2-3 are the weight-6
    Z products (adjacent row pairs). Logical X = X_0 X_3 X_6 (a column),
    logical Z = Z_0 Z_1 Z_2 (a row). The weight-2 gauge group is not represented
    here; it appears only in the syndrome-extraction gadget.
  stabilizers:
    - X_0 X_1 X_3 X_4 X_6 X_7
    - X_1 X_2 X_4 X_5 X_7 X_8
    - Z_0 Z_1 Z_2 Z_3 Z_4 Z_5
    - Z_3 Z_4 Z_5 Z_6 Z_7 Z_8
  x: [X_0 X_3 X_6]
  z: [Z_0 Z_1 Z_2]
---
# Prepare |0_L>: reset all data to |0>, then project by measuring the six XX
# gauge operators (ancillas 9-14). The X stabilizers are reconstructed from gauge
# products and seeded onto the outgoing frame.
prepare_z.gadget.yaml:
  circuit:
    source:
      - R: [0]
      - R: [1]
      - R: [2]
      - R: [3]
      - R: [4]
      - R: [5]
      - R: [6]
      - R: [7]
      - R: [8]
      - R: [9]
      - R: [10]
      - R: [11]
      - R: [12]
      - R: [13]
      - R: [14]
      - H: [9]
      - H: [10]
      - H: [11]
      - H: [12]
      - H: [13]
      - H: [14]
      - CX: [9, 0]
      - CX: [9, 1]
      - CX: [10, 1]
      - CX: [10, 2]
      - CX: [11, 3]
      - CX: [11, 4]
      - CX: [12, 4]
      - CX: [12, 5]
      - CX: [13, 6]
      - CX: [13, 7]
      - CX: [14, 7]
      - CX: [14, 8]
      - H: [9]
      - H: [10]
      - H: [11]
      - H: [12]
      - H: [13]
      - H: [14]
      - M: [9]
      - M: [10]
      - M: [11]
      - M: [12]
      - M: [13]
      - M: [14]
  checks:
    - [
        "circuit.readouts[0]",
        "circuit.readouts[2]",
        "circuit.readouts[4]",
        "out[0].stabilizers[0]",
      ]
    - [
        "circuit.readouts[1]",
        "circuit.readouts[3]",
        "circuit.readouts[5]",
        "out[0].stabilizers[1]",
      ]
    - ["out[0].stabilizers[2]"]
    - ["out[0].stabilizers[3]"]
---
# One gauge syndrome-extraction round. Six XX gauge operators (ancillas 9-14, in
# |+>) on horizontal neighbours, and six ZZ gauge operators (ancillas 15-20) on
# vertical neighbours. readouts[0..5] are the XX gauges, readouts[6..11] the ZZ
# gauges. Each weight-6 stabilizer is the XOR of three gauge readouts, tied to
# the incoming sign (cross-round detector) and carried to the outgoing sign.
idle.gadget.yaml:
  circuit:
    source:
      - R: [9]
      - R: [10]
      - R: [11]
      - R: [12]
      - R: [13]
      - R: [14]
      - R: [15]
      - R: [16]
      - R: [17]
      - R: [18]
      - R: [19]
      - R: [20]
      - H: [9]
      - H: [10]
      - H: [11]
      - H: [12]
      - H: [13]
      - H: [14]
      - CX: [9, 0]
      - CX: [9, 1]
      - CX: [10, 1]
      - CX: [10, 2]
      - CX: [11, 3]
      - CX: [11, 4]
      - CX: [12, 4]
      - CX: [12, 5]
      - CX: [13, 6]
      - CX: [13, 7]
      - CX: [14, 7]
      - CX: [14, 8]
      - H: [9]
      - H: [10]
      - H: [11]
      - H: [12]
      - H: [13]
      - H: [14]
      - CX: [0, 15]
      - CX: [3, 15]
      - CX: [3, 16]
      - CX: [6, 16]
      - CX: [1, 17]
      - CX: [4, 17]
      - CX: [4, 18]
      - CX: [7, 18]
      - CX: [2, 19]
      - CX: [5, 19]
      - CX: [5, 20]
      - CX: [8, 20]
      - M: [9]
      - M: [10]
      - M: [11]
      - M: [12]
      - M: [13]
      - M: [14]
      - M: [15]
      - M: [16]
      - M: [17]
      - M: [18]
      - M: [19]
      - M: [20]
  checks:
    - [
        "circuit.readouts[0]",
        "circuit.readouts[2]",
        "circuit.readouts[4]",
        "in[0].stabilizers[0]",
      ]
    - [
        "circuit.readouts[1]",
        "circuit.readouts[3]",
        "circuit.readouts[5]",
        "in[0].stabilizers[1]",
      ]
    - [
        "circuit.readouts[6]",
        "circuit.readouts[8]",
        "circuit.readouts[10]",
        "in[0].stabilizers[2]",
      ]
    - [
        "circuit.readouts[7]",
        "circuit.readouts[9]",
        "circuit.readouts[11]",
        "in[0].stabilizers[3]",
      ]
    - [
        "circuit.readouts[0]",
        "circuit.readouts[2]",
        "circuit.readouts[4]",
        "out[0].stabilizers[0]",
      ]
    - [
        "circuit.readouts[1]",
        "circuit.readouts[3]",
        "circuit.readouts[5]",
        "out[0].stabilizers[1]",
      ]
    - [
        "circuit.readouts[6]",
        "circuit.readouts[8]",
        "circuit.readouts[10]",
        "out[0].stabilizers[2]",
      ]
    - [
        "circuit.readouts[7]",
        "circuit.readouts[9]",
        "circuit.readouts[11]",
        "out[0].stabilizers[3]",
      ]
---
# Destructive logical-Z readout: measure all data in Z. The two Z stabilizers
# (rows 0-1 and 1-2) become deterministic checks; logical Z = Z_0 Z_1 Z_2.
measure_z.gadget.yaml:
  circuit:
    source:
      - M: [0]
      - M: [1]
      - M: [2]
      - M: [3]
      - M: [4]
      - M: [5]
      - M: [6]
      - M: [7]
      - M: [8]
  checks:
    - ["circuit.readouts[0:6]", "in[0].stabilizers[2]"]
    - ["circuit.readouts[3:9]", "in[0].stabilizers[3]"]
  readouts:
    - ["circuit.readouts[0,1,2]", "in[0].z[0]"]
---
# Destructive logical-X readout: measure all data in X. The two X stabilizers
# become deterministic checks; logical X = X_0 X_3 X_6.
measure_x.gadget.yaml:
  circuit:
    source:
      - MX: [0]
      - MX: [1]
      - MX: [2]
      - MX: [3]
      - MX: [4]
      - MX: [5]
      - MX: [6]
      - MX: [7]
      - MX: [8]
  checks:
    - ["circuit.readouts[0,1,3,4,6,7]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1,2,4,5,7,8]", "in[0].stabilizers[1]"]
  readouts:
    - ["circuit.readouts[0,3,6]", "in[0].x[0]"]
