# Rotated surface code, distance 3 ([[9,1,3]]) — single-file qodec bundle (generated).
#
# The practical workhorse of fault tolerance (Fowler, Mariantoni, Martinis, Cleland,
# Phys. Rev. A 86, 032324, 2012). This is the distance-3 member of the rotated
# surface-code family: 9 data qubits on a 3x3 grid, weight-4 bulk plaquettes in
# an X/Z checkerboard plus weight-2 boundary checks, one logical qubit. It is a
# memory experiment: prepare, repeated syndrome rounds with cross-round detectors,
# then destructive readout.
#
# Generated by surface.py (build_surface_code(3)); change the distance to
# generate any other family member. The committed bundle is the d=3 member.
#
# Reference: A. G. Fowler, M. Mariantoni, J. M. Martinis, A. N. Cleland,
# "Surface codes: Towards practical large-scale quantum computation,"
# Phys. Rev. A 86, 032324 (2012).
---
qodec.yaml:
  name: surface_d3
  description: >-
    Distance-3 rotated surface code ([[9,1,3]]) — the practical workhorse of
    QEC, as a memory experiment (prepare, syndrome rounds with cross-round
    detectors, destructive readout). The d=3 member of the surface-code family
    built by surface.py. The d=3 member also demonstrates lattice surgery: merge_zz fuses two patches into a 7x3 merged patch, measuring the joint logical Z_A Z_B.
  layers:
    - instruction_set: surface.isa.yaml
      codes:
        surface: surface.code.yaml
        merged: merged.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        prepare_x: prepare_x.gadget.yaml
        idle: idle.gadget.yaml
        measure_z: measure_z.gadget.yaml
        measure_x: measure_x.gadget.yaml
        merge_zz: merge_zz.gadget.yaml
        measure_merged_z: measure_merged_z.gadget.yaml
        measure_merged_x: measure_merged_x.gadget.yaml
    - instruction_set: ../stim.isa.yaml
---
surface.isa.yaml:
  name: surface
  description: Logical instruction set for the distance-3 rotated surface code.
  blocks: { surface: 1, merged: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [surface]
      action: [stabilize: Z_0]
    - mnemonic: prepare_x
      description: Prepare the logical |+> state.
      out: [surface]
      action: [stabilize: X_0]
    - mnemonic: idle
      description: One full syndrome-extraction round (identity logical action).
      in: [surface]
      out: [surface]
    - mnemonic: measure_z
      description: Destructive measurement of the logical Z observable.
      in: [surface]
      action: [observe: Z_0]
    - mnemonic: measure_x
      description: Destructive measurement of the logical X observable.
      in: [surface]
      action: [observe: X_0]
    - mnemonic: merge_zz
      description: >-
        Lattice-surgery ZZ-merge: consume two surface patches, produce one merged
        patch, measuring the joint logical Z_A (x) Z_B. The observe records the
        joint parity; the clifford transfers the surviving logical frame onto the
        merged block (merged X = X_0 X_1, merged Z = Z_0 == Z_1).
      in: [surface, surface]
      out: [merged]
      action:
        - observe: "Z_0 Z_1"
        - clifford: { X_0: X_0 X_1, Z_1: Z_0 Z_1 }
    - mnemonic: measure_merged_z
      description: Destructive measurement of the merged logical Z observable.
      in: [merged]
      action: [observe: Z_0]
    - mnemonic: measure_merged_x
      description: Destructive measurement of the merged logical X observable.
      in: [merged]
      action: [observe: X_0]
---
surface.code.yaml:
  name: surface
  description: >-
    Distance-3 rotated surface code on a 3x3 grid (8 stabilizers:
    weight-4 bulk plaquettes in an X/Z checkerboard plus weight-2 boundary
    checks). Logical X = left column, logical Z = top row.
  stabilizers:
    - X_1 X_2
    - Z_0 Z_3
    - X_0 X_1 X_3 X_4
    - Z_1 Z_2 Z_4 Z_5
    - Z_3 Z_4 Z_6 Z_7
    - X_4 X_5 X_7 X_8
    - Z_5 Z_8
    - X_6 X_7
  x: [X_0 X_3 X_6]
  z: [Z_0 Z_1 Z_2]
---
