# Canonical Stim physical ISA — the single shared definition for the catalog.
#
# The standard Stim gate set carries the same formal action (Clifford tableau,
# Pauli, or measurement) in every project, so each catalog example references
# this one file (`instruction_set: ../stim.isa.yaml`) as its physical layer instead of
# re-declaring the gate set in its bundle. An example uses whatever subset it
# needs; unused instructions are harmless. (Magic-state examples that also need
# a non-Clifford T keep their own `stim_t` ISA — that gate is not standard Stim.)
# The layer's `instruction_set` field identifies this as an ISA document; its filename is
# a convention, not a type requirement. The path resolves relative to the
# containing manifest, preserving `..`; no directory scan finds this file.
name: stim
description: >-
  Canonical Stim-compatible physical ISA: resets, single-qubit Cliffords and
  Paulis, CX/CZ, and destructive plus two-body Pauli measurements. Shared by
  every catalog example as its bottom (physical) layer.
blocks: { qubit: 1 }
instructions:
  - mnemonic: I
    description: Identity.
    in: [qubit]
    out: [qubit]
    action: []
  - mnemonic: R
    description: Reset to |0>.
    out: [qubit]
    action: [stabilize: Z_0]
  - mnemonic: H
    description: Hadamard.
    in: [qubit]
    out: [qubit]
    action: [clifford: { X_0: Z_0, Z_0: X_0 }]
  - mnemonic: S
    description: Phase gate.
    in: [qubit]
    out: [qubit]
    action: [clifford: { X_0: Y_0, Z_0: Z_0 }]
  - mnemonic: X
    description: Pauli X.
    in: [qubit]
    out: [qubit]
    action: [pauli: X_0]
  - mnemonic: Y
    description: Pauli Y.
    in: [qubit]
    out: [qubit]
    action: [pauli: Y_0]
  - mnemonic: Z
    description: Pauli Z.
    in: [qubit]
    out: [qubit]
    action: [pauli: Z_0]
  - mnemonic: Z_if
    description: >-
      Pauli Z applied only when the supplied classical bit is set — Stim's
      `CZ rec[-k] q`. A measurement-based preparation uses this to feed its
      outcome forward, so that the state it produces is definite rather than
      one of several branches.
    in: [qubit]
    out: [qubit]
    parameters: { correction: bit }
    action:
      - pauli: Z_0
        if: [correction]
  - mnemonic: X_if
    description: >-
      Pauli X applied only when the supplied classical bit is set — Stim's
      `CX rec[-k] q`, and the dual of `Z_if`.
    in: [qubit]
    out: [qubit]
    parameters: { correction: bit }
    action:
      - pauli: X_0
        if: [correction]
  - mnemonic: CX
    description: Controlled-X (CNOT).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [clifford: { X_0: X_0 X_1, Z_1: Z_0 Z_1 }]
  - mnemonic: CZ
    description: Controlled-Z.
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [clifford: { X_0: X_0 Z_1, X_1: Z_0 X_1, Z_0: Z_0, Z_1: Z_1 }]
  - mnemonic: SWAP
    description: Swap two qubits.
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [clifford: { X_0: X_1, X_1: X_0, Z_0: Z_1, Z_1: Z_0 }]
  - mnemonic: M
    description: Destructive Z-basis measurement.
    in: [qubit]
    action: [observe: Z_0]
  - mnemonic: MX
    description: Destructive X-basis measurement.
    in: [qubit]
    action: [observe: X_0]
  - mnemonic: MXX
    description: Two-body XX-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [observe: "X_0 X_1"]
  - mnemonic: MYY
    description: Two-body YY-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [observe: "Y_0 Y_1"]
  - mnemonic: MZZ
    description: Two-body ZZ-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action: [observe: "Z_0 Z_1"]
