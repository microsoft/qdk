name: NLBPhysical
description: |
  Physical-level ISA for the NLB architecture example. The Clifford
  set borrowed from c4c6/ (R, H, CX, M, X, Z, SWAP) plus the two
  non-Clifford primitives needed to express logical CCZ on the
  [[8,3,2]] code transversally:

    T   = exp(-iπ/8 · Z) up to global phase, i.e. a Pauli-Z
          rotation by angle +π/4 in the qodec convention.
    Tdg = exp(+iπ/8 · Z) up to global phase, angle -π/4.

  These are applied vertex-by-vertex on a c832 block (T on the four
  even-Hamming-weight vertices, Tdg on the four odd ones) to realise
  logical CCZ — see ccz_c832.gadget.yaml.

  Going outside the Clifford group means this ISA is no longer
  Stim-runnable, but qodec's `rotate` action keeps the audit
  equivalence checks expressive.

  Pauli operators below use the explicit indexed form `Z_0`
  rather than the bare `Z` shorthand, since rotate axes require
  the indexed form and consistency is easier to maintain.
blocks: { c422_c832_qubit: 1 }
instructions:
  - mnemonic: R
    description: Reset qubit to |0⟩.
    out: [c422_c832_qubit]
    action:
      - stabilize: Z_0
  - mnemonic: H
    description: Hadamard gate.
    in: [c422_c832_qubit]
    out: [c422_c832_qubit]
    action:
      - clifford:
          X_0: Z_0
          Z_0: X_0
  - mnemonic: CX
    description: Controlled-X (CNOT).
    in: [c422_c832_qubit, c422_c832_qubit]
    out: [c422_c832_qubit, c422_c832_qubit]
    action:
      - clifford:
          X_0: X_0 X_1
          Z_1: Z_0 Z_1
  - mnemonic: M
    description: Destructive Z-basis measurement.
    in: [c422_c832_qubit]
    action:
      - observe: Z_0
  - mnemonic: X
    description: Pauli X gate.
    in: [c422_c832_qubit]
    out: [c422_c832_qubit]
    action:
      - pauli: X_0
  - mnemonic: Z
    description: Pauli Z gate.
    in: [c422_c832_qubit]
    out: [c422_c832_qubit]
    action:
      - pauli: Z_0
  - mnemonic: SWAP
    description: Swap two qubits.
    in: [c422_c832_qubit, c422_c832_qubit]
    out: [c422_c832_qubit, c422_c832_qubit]
    action:
      - clifford:
          X_0: X_1
          X_1: X_0
          Z_0: Z_1
          Z_1: Z_0
  - mnemonic: T
    description: |
      π/8 phase gate. T = exp(-iπ/8 · Z) up to global phase, i.e. a
      Pauli-Z rotation by angle +π/4 in the qodec convention.
    in: [c422_c832_qubit]
    out: [c422_c832_qubit]
    action:
      - rotate:
          pauli: Z_0
          angle: 0.7853981633974483
  - mnemonic: Tdg
    description: |
      Inverse π/8 phase gate. Tdg = exp(+iπ/8 · Z) up to global phase,
      i.e. a Pauli-Z rotation by angle -π/4.
    in: [c422_c832_qubit]
    out: [c422_c832_qubit]
    action:
      - rotate:
          pauli: Z_0
          angle: -0.7853981633974483
