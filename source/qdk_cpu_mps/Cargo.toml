[package]
name = "qdk_cpu_mps"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# t4a-faer is this crate's alone: removing the crate removes it from the
# workspace. Pinned to one version: its owner publishes semver-major
# releases days apart, so each update needs the SVD's checks and timings
# rerun.
# Its library is named `faer`; renamed so that code never reads as faer's.
t4a_faer = { package = "t4a-faer", version = "=0.31.0", default-features = false, features = ["std", "linalg"] }
num-complex = { workspace = true }
tensornet = { path = "../tensornet" }
thiserror = { workspace = true }

[dev-dependencies]
paulimer = { workspace = true }
qdk_simulators = { path = "../simulators", default-features = false }
tensornet = { path = "../tensornet", features = ["conformance"] }

[lints]
workspace = true
