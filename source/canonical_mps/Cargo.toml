[package]
name = "canonical_mps"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
num-complex = { workspace = true }
# The dense linear algebra's products, QR decompositions and fast SVD route
# (src/dense_linalg/kernels/t4a_faer.rs), and only theirs. Pinned to one
# version: its owner publishes semver-major releases days apart, so each
# update needs the SVD's checks and timings rerun.
# Its library is named `faer`; renamed so that code never reads as faer's.
t4a_faer = { package = "t4a-faer", version = "=0.31.0", default-features = false, features = ["std", "linalg"] }
tensornet = { path = "../tensornet" }
thiserror = { workspace = true }

[features]
# Exposes what another crate needs to check its own `SiteAlgebra`: the
# conformance kit (`site_algebra::conformance`), the circuits that run the engine
# on it against the exact reference (`engine_conformance`), and the dense
# linear algebra (`dense_linalg`), for the test doubles of a backend library.
conformance = ["tensornet/conformance"]

[dev-dependencies]
# The crate itself with the kit, so that the kit's doctest and the
# integration test that runs it on the reference algebra run in every
# `cargo test`, the workspace's included.
canonical_mps = { path = ".", features = ["conformance"] }
# The integration tests compare with the stabilizer simulator, whose
# observables are paulimer's, and with the sparse state simulator.
paulimer = { workspace = true }
qdk_simulators = { path = "../simulators", default-features = false }

[lints]
workspace = true
