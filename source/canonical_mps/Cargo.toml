[package]
name = "canonical_mps"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The dense linear algebra's steps (src/dense_linalg/kernels/), both
# already in the QDK's dependency tree: matrixmultiply's complex `zgemm`
# (its `cgemm` feature; the product under ndarray's complex products and
# nalgebra's real ones) for the products, and nalgebra for the thin QR.
# The column-pivoted QR is the crate's own.
matrixmultiply = { workspace = true, features = ["cgemm"] }
nalgebra = { workspace = true }
num-complex = { workspace = true }
tensornet = { path = "../tensornet" }
thiserror = { workspace = true }

[features]
# Exposes what another crate needs to check its own `SiteAlgebra`: the
# conformance kit (`site_algebra::conformance`), the engine's conformance
# circuits, which run the engine on it against the exact reference
# (`engine_conformance`), and the dense linear algebra (`dense_linalg`), for
# the stand-ins of a backend library in its tests.
conformance = ["tensornet/conformance"]

[dev-dependencies]
# The crate itself with the kit, so that the kit's doctest and the
# integration test that runs it on the CPU algebra run in every
# `cargo test`, the workspace's included.
canonical_mps = { path = ".", features = ["conformance"] }

[lints]
workspace = true
