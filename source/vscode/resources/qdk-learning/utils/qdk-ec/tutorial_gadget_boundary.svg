<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 272" width="100%" style="max-width:100%;height:auto" class="qdk-ec-gadget" role="img" data-asset="tutorial_gadget_boundary.svg" aria-label="General anatomy of a qodec gadget connecting input and output block encodings across a target-layer circuit to parity checks and logical readouts."> <style> .qdk-ec-gadget { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-gadget .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-gadget .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-gadget .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-gadget .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-gadget .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-gadget .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-gadget .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-gadget .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-gadget .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-gadget .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-gadget .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-gadget .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-gadget .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-gadget .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-gadget .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-gadget .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-gadget .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-gadget .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-gadget .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-gadget .badge-blue { fill: #1976d2; } .qdk-ec-gadget .badge-teal { fill: #0d9488; } .qdk-ec-gadget .badge-purple { fill: #7c3aed; } .qdk-ec-gadget .badge-red { fill: #dc2626; } .qdk-ec-gadget .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-gadget .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-gadget .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-gadget .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-gadget .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-gadget .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-gadget .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-gadget .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <defs> <marker id="gdg-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"> <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/> </marker> </defs> <rect x="14" y="24" width="194" height="108" rx="8" class="stage-blue"/> <text x="111" y="48" text-anchor="middle" class="box-title">Input Encodings (in)</text> <text x="111" y="68" text-anchor="middle" class="box-sub">Maps input blocks to qubits</text> <text x="111" y="86" text-anchor="middle" class="box-sub">(empty on preparations)</text> <text x="111" y="112" text-anchor="middle" class="code-tag">in[b].stabilizers &#183; x, z</text> <path d="M 210 78 L 238 78" class="conn" marker-end="url(#gdg-arr)"/> <rect x="242" y="16" width="416" height="126" rx="10" class="cluster-teal"/> <text x="450" y="38" text-anchor="middle" class="hdr-teal">GADGET CIRCUIT (TARGET ISA)</text> <text x="450" y="60" text-anchor="middle" class="box-sub">Target-layer operations on block support and ancilla qubits</text> <text x="450" y="80" text-anchor="middle" class="box-sub">Resets, unitary gates, and measurements</text> <text x="450" y="106" text-anchor="middle" class="box-sub">Measurements record indexed classical bits:</text> <text x="450" y="126" text-anchor="middle" class="code-tag">circuit.readouts[0], circuit.readouts[1], ...</text> <path d="M 660 78 L 688 78" class="conn" marker-end="url(#gdg-arr)"/> <rect x="692" y="24" width="194" height="108" rx="8" class="stage-blue"/> <text x="789" y="48" text-anchor="middle" class="box-title">Output Encodings (out)</text> <text x="789" y="68" text-anchor="middle" class="box-sub">Maps output blocks to qubits</text> <text x="789" y="86" text-anchor="middle" class="box-sub">(empty on destructive readouts)</text> <text x="789" y="112" text-anchor="middle" class="code-tag">out[b].stabilizers &#183; x, z</text> <path d="M 355 142 L 355 159 L 242 159 L 242 174" class="conn" marker-end="url(#gdg-arr)"/> <path d="M 545 142 L 545 159 L 658 159 L 658 174" class="conn" marker-end="url(#gdg-arr)"/> <rect x="46" y="176" width="392" height="82" rx="8" class="cluster-blue"/> <text x="242" y="198" text-anchor="middle" class="hdr-blue">CHECKS (XOR PARITY = 0 IF FAULT-FREE)</text> <text x="242" y="218" text-anchor="middle" class="box-sub">Constraints relating boundary stabilizers &amp; measurement bits</text> <text x="242" y="240" text-anchor="middle" class="code-tag">XOR of listed references = 0 without faults</text> <rect x="462" y="176" width="392" height="82" rx="8" class="cluster-purple"/> <text x="658" y="198" text-anchor="middle" class="hdr-purple">READOUTS (OBSERVABLES THEN FLAGS)</text> <text x="658" y="218" text-anchor="middle" class="box-sub">Positional logical outcomes first, followed by named flags</text> <text x="658" y="240" text-anchor="middle" class="code-tag">XOR of incoming frames &amp; measurement bits</text> </svg>
