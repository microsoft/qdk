<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 500" width="100%" style="max-width:100%;height:auto" class="qdk-ec-workflow" role="img" data-asset="tutorial_qec_workflow.svg" aria-label="Workflow across Units 01 through 10 organized into Develop, Test, and Deploy stages."> <style> .qdk-ec-workflow { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-workflow .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-workflow .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-workflow .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-workflow .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-workflow .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-workflow .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-workflow .badge-blue { fill: #1976d2; } .qdk-ec-workflow .badge-teal { fill: #0d9488; } .qdk-ec-workflow .badge-purple { fill: #7c3aed; } .qdk-ec-workflow .badge-red { fill: #dc2626; } .qdk-ec-workflow .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-workflow .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-workflow .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-workflow .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-workflow .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-workflow .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-workflow .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-workflow .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <defs> <marker id="qec-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"> <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/> </marker> </defs> <rect x="18" y="12" width="674" height="134" rx="10" class="cluster-blue"/> <text x="355" y="32" text-anchor="middle" class="hdr-blue">1. DEVELOP &#8212; CODE &amp; PROTOCOL SPECIFICATION</text> <rect x="30" y="42" width="198" height="96" rx="8" class="stage-blue"/> <rect x="40" y="52" width="26" height="18" rx="4" class="badge-blue"/> <text x="53" y="64.5" text-anchor="middle" class="badge-txt">01</text> <text x="74" y="65" class="box-title">Define &amp; Profile Code</text> <text x="40" y="88" class="box-sub">Stabilizers &amp; logical X, Z</text> <text x="40" y="104" class="box-sub">Compute code distance</text> <text x="40" y="124" class="code-tag">Code &#183; CodeProfile</text> <path d="M 231 90 L 252 90" class="conn" marker-end="url(#qec-arr)"/> <rect x="256" y="42" width="198" height="96" rx="8" class="stage-blue"/> <rect x="266" y="52" width="26" height="18" rx="4" class="badge-blue"/> <text x="279" y="64.5" text-anchor="middle" class="badge-txt">02</text> <text x="300" y="65" class="box-title">Build Baseline Qodec</text> <text x="266" y="88" class="box-sub">Logical &amp; physical ISAs</text> <text x="266" y="104" class="box-sub">Formal instruction actions</text> <text x="266" y="124" class="code-tag">build_qodec &#183; InstructionSe