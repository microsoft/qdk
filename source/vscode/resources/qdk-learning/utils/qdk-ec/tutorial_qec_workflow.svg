<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 478" width="100%" class="qdk-ec-workflow" role="img" data-asset="tutorial_qec_workflow.svg" aria-label="QDK-EC course outline across Develop, Test, and Deploy stages"> <style> .qdk-ec-workflow { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-workflow .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-workflow .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-workflow .cluster-hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .cluster-hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .cluster-hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-workflow .box-title { fill: var(--qdk-fg); font-size: 11.4px; font-weight: 700; } .qdk-ec-workflow .box-sub { fill: color-mix(in srgb, var(--qdk-fg) 84%, transparent); font-size: 9.8px; } .qdk-ec-workflow .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9px; font-weight: 600; } .qdk-ec-workflow .badge-blue { fill: #1976d2; } .qdk-ec-workflow .badge-teal { fill: #0d9488; } .qdk-ec-workflow .badge-purple { fill: #7c3aed; } .qdk-ec-workflow .badge-txt { fill: #ffffff; font-size: 9.8px; font-weight: 700; } .qdk-ec-workflow .conn { stroke: color-mix(in srgb, var(--qdk-fg) 65%, transparent); stroke-width: 2.2; fill: none; } </style> <defs> <marker id="qec-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/></marker> </defs> <rect x="12" y="12" width="674" height="134" rx="10" class="cluster-blue"/> <text x="349.0" y="32" text-anchor="middle" class="cluster-hdr-blue">1. DEVELOP &#8212; CODE &amp; PROTOCOL SPECIFICATION</text> <rect x="24" y="42" width="198" height="96" rx="8" class="stage-blue"/> <rect x="34" y="52" width="26" height="18" rx="4" class="badge-blue"/> <text x="47.0" y="64.5" text-anchor="middle" class="badge-txt">01</text> <text x="68" y="65" class="box-title">Define &amp; Profile Code</text> <text x="34" y="88" class="box-sub">Stabilizers &amp; logical X, Z</text> <text x="34" y="104" class="box-sub">Verify [[n, k, d]] &amp; biased d</text> <text x="34" y="124" class="code-tag">qodec.Code &#183; ec.CodeProfile</text> <path d="M 225 90 L 246 90" class="conn" marker-end="url(#qec-arr)"/> <rect x="250" y="42" width="198" height="96" rx="8" class="stage-blue"/> <rect x="260" y="52" width="26" height="18" rx="4" class="badge-blue"/> <text x="273.0" y="64.5" text-anchor="middle" class="badge-txt">02</text> <text x="294" y="65" class="box-title">Build Baseline Qodec</text> <text x="260" y="88" class="box-sub">Logical &amp; physical ISAs</text> <text x="260" y="104" class="box-sub">Stabilize, Clifford, Observe</text> <text x="260" y="124" class="code-tag">ec.build_qodec(&quot;bare-css/v1&quot;)</text> <path d="M 451 90 L 472 90" class="conn" marker-end="url(#qec-arr)"/> <rect x="476" y="42" width="198" height="96" rx="8" class="stage-blue"/> <rect x="486" y="52" width="26" height="18" rx="4" class="badge-blue"/> <text x="499.0" y="64.5" text-anchor="middle" class="badge-txt">03</text> <text x="520" y="65" class="box-title">Inspect Gadget Anatomy</text> <text x="486" y="88" class="box-sub">Stim circuit &amp; block in/out</text> <text x="486" y="104" class="box-sub">Parity checks &amp; readouts</text> <text x="486" y="124" class="code-tag">gadget.circuit &#183; checks</text> <path d="M 349.0 146 L 349.0 169" class="conn" marker-end="url(#qec-arr)"/> <rect x="238" y="172" width="674" height="134" rx="10" class="cluster-teal"/> <text x="575.0" y="192" text-anchor="middle" class="cluster-hdr-teal">2. TEST &#8212; STATIC VERIFICATION &amp; FAULT TOLERANCE</text> <rect x="250" y="202" width="198" height="96" rx="8" class="stage-teal"/> <rect x="260" y="212" width="26" height="18" rx="4" class="badge-teal"/> <text x="273.0" y="224.5" text-anchor="middle" class="badge-txt">04</text> <text x="294" y="225" class="box-title">Validate &amp; Fill Gadgets</text> <text x="260" y="248" class="box-sub">Circuit action vs. objective</text> <text x="260" y="264" class="box-sub">Auto-derive checks &amp; readouts</text> <text x="260" y="284" class="code-tag">GadgetProfile &#183; audit &#183; filled</text> <path d="M 451 250 L 472 250" class="conn" marker-end="url(#qec-arr)"/> <rect x="476" y="202" width="198" height="96" rx="8" class="stage-teal"/> <rect x="486" y="212" width="26" height="18" rx="4" class="badge-teal"/> <text x="499.0" y="224.5" text-anchor="middle" class="badge-txt">05</text> <text x="520" y="225" class="box-title">Analyze Circuit Distance</text> <text x="486" y="248" class="box-sub">Min-weight fault witnesses</text> <text x="486" y="264" class="box-sub">Trace problematic errors</text> <text x="486" y="284" class="code-tag">distance() &#183; effects_of()</text> <path d="M 677 250 L 698 250" class="conn" marker-end="url(#qec-arr)"/> <rect x="702" y="202" width="198" height="96" rx="8" class="stage-teal"/> <rect x="712" y="212" width="26" height="18" rx="4" class="badge-teal"/> <text x="725.0" y="224.5" text-anchor="middle" class="badge-txt">06</text> <text x="746" y="225" class="box-title">Upgrade for Fault Tolerance</text> <text x="712" y="248" class="box-sub">Interleaved syndrome checks</text> <text x="712" y="264" class="box-sub">Flagged prep (flags: [reject])</text> <text x="712" y="284" class="code-tag">d_circuit: 1 &#8594; 2 across gadgets</text> <path d="M 575.0 306 L 575.0 329" class="conn" marker-end="url(#qec-arr)"/> <rect x="464" y="332" width="674" height="134" rx="10" class="cluster-purple"/> <text x="801.0" y="352" text-anchor="middle" class="cluster-hdr-purple">3. DEPLOY &#8212; LOGICAL COMPILATION, SIMULATION &amp; TARGET HARDWARE</text> <rect x="476" y="362" width="198" height="96" rx="8" class="stage-purple"/> <rect x="486" y="372" width="38" height="18" rx="4" class="badge-purple"/> <text x="505.0" y="384.5" text-anchor="middle" class="badge-txt">07-08</text> <text x="532" y="385" class="box-title">Compile Logical Programs</text> <text x="486" y="408" class="box-sub">Q# &amp; OpenQASM 3 intrinsics</text> <text x="486" y="424" class="box-sub">Compile SPAM &amp; CNOT to QIR</text> <text x="486" y="444" class="code-tag">qdk.qsharp &#183; qdk.openqasm</text> <path d="M 677 410 L 698 410" class="conn" marker-end="url(#qec-arr)"/> <rect x="702" y="362" width="198" height="96" rx="8" class="stage-purple"/> <rect x="712" y="372" width="26" height="18" rx="4" class="badge-purple"/> <text x="725.0" y="384.5" text-anchor="middle" class="badge-txt">09</text> <text x="746" y="385" class="box-title">Simulate &amp; Decode</text> <text x="712" y="408" class="box-sub">Sample noisy circuit shots</text> <text x="712" y="424" class="box-sub">Filter flags &amp; low confidence</text> <text x="712" y="444" class="code-tag">run_qir(..., decoder=deq)</text> <path d="M 903 410 L 924 410" class="conn" marker-end="url(#qec-arr)"/> <rect x="928" y="362" width="198" height="96" rx="8" class="stage-purple"/> <rect x="938" y="372" width="26" height="18" rx="4" class="badge-purple"/> <text x="951.0" y="384.5" text-anchor="middle" class="badge-txt">10</text> <text x="972" y="385" class="box-title">Target Hardware Study</text> <text x="938" y="408" class="box-sub">Magne zone-global H+SWAP</text> <text x="938" y="424" class="box-sub">Evaluate under hardware noise</text> <text x="938" y="444" class="code-tag">hadamard_swap_all &#183; NoiseConfig</text> </svg>
