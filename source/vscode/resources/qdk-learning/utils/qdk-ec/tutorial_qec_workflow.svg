()</text> <path d="M 683 260 L 704 260" class="conn" marker-end="url(#qec-arr)"/> <rect x="708" y="212" width="198" height="96" rx="8" class="stage-teal"/> <rect x="718" y="222" width="26" height="18" rx="4" class="badge-teal"/> <text x="731" y="234.5" text-anchor="middle" class="badge-txt">06</text> <text x="752" y="235" class="box-title">Upgrade Gadgets</text> <text x="718" y="258" class="box-sub">Interleaved syndrome</text> <text x="718" y="274" class="box-sub">Flagged preparation</text> <text x="718" y="294" class="code-tag">flags: [reject] &#183; distance = 2</text> <path d="M 807 308 L 807 333 Q 807 339 801 339 L 587 339 Q 581 339 581 345 L 581 350" class="conn" marker-end="url(#qec-arr)"/> <rect x="470" y="352" width="674" height="134" rx="10" class="cluster-purple"/> <text x="807" y="372" text-anchor="middle" class="hdr-purple">3. DEPLOY &#8212; LOGICAL COMPILATION, SIMULATION &amp; HARDWARE NOISE</text> <rect x="482" y="382" width="198" height="96" rx="8" class="stage-purple"/> <rect x="492" y="392" width="38" height="18" rx="4" class="badge-purple"/> <text x="511" y="404.5" text-anchor="middle" class="badge-txt">07-08</text> <text x="538" y="405" class="box-title">Compile to QIR</text> <text x="492" y="428" class="box-sub">Q# &amp; OpenQASM intrinsics</text> <text x="492" y="444" class="box-sub">SPAM, CNOT &amp; memory</text> <text x="492" y="464" class="code-tag">compile &#183; TargetProfile</text> <path d="M 683 430 L 704 430" class="conn" marker-end="url(#qec-arr)"/> <rect x="708" y="382" width="198" height="96" rx="8" class="stage-purple"/> <rect x="718" y="392" width="26" height="18" rx="4" class="badge-purple"/> <text x="731" y="404.5" text-anchor="middle" class="badge-txt">09</text> <text x="752" y="405" class="box-title">Simulate &amp; Decode</text> <text x="718" y="428" class="box-sub">Sample noisy QIR shots</text> <text x="718" y="444" class="box-sub">Filter readout confidence</text> <text x="718" y="464" class="code-tag">run_qir &#183; prepare_d