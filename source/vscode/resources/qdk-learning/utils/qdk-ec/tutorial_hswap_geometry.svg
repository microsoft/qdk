<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 288" width="100%" style="max-width:100%;height:auto" class="qdk-ec-hswap" role="img" data-asset="tutorial_hswap_geometry.svg" aria-label="Schematic of the zone-global H 0 1 2 3 pulse acting in parallel on qubits q0 through q3 and its induced two-qubit logical Clifford and stabilizer-swap contract on C4."> <style> .qdk-ec-hswap { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-hswap .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-hswap .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-hswap .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-hswap .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-hswap .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-hswap .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-hswap .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-hswap .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-hswap .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-hswap .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-hswap .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-hswap .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-hswap .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-hswap .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-hswap .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-hswap .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-hswap .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-hswap .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-hswap .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-hswap .badge-blue { fill: #1976d2; } .qdk-ec-hswap .badge-teal { fill: #0d9488; } .qdk-ec-hswap .badge-purple { fill: #7c3aed; } .qdk-ec-hswap .badge-red { fill: #dc2626; } .qdk-ec-hswap .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-hswap .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-hswap .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-hswap .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-hswap .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-hswap .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-hswap .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-hswap .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <defs> <marker id="hsw-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"> <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/> </marker> </defs> <rect x="14" y="14" width="356" height="260" rx="10" class="cluster-purple"/> <text x="192" y="36" text-anchor="middle" class="hdr-purple">PHYSICAL GADGET &#8212; ZONE-GLOBAL PULSE</text> <rect x="130" y="48" width="128" height="148" rx="8" class="stage-purple" stroke-dasharray="5 3"/> <text x="194" y="66" text-anchor="middle" class="code-tag">H 0 1 2 3</text> <text x="38" y="100" class="code-tag">q0</text> <line x1="66" y1="96" x2="338" y2="96" class="wire"/> <rect x="178" y="86" width="32" height="20" rx="4" class="qubit-node"/> <text x="194" y="100" text-anchor="middle" class="box-title">H</text> <text x="38" y="126" class="code-tag">q1</text> <line x1="66" y1="122" x2="338" y2="122" class="wire"/> <rect x="178" y="112" width="32" height="20" rx="4" class="qubit-node"/> <text x="194" y="126" text-anchor="middle" class="box-title">H</text> <text x="38" y="152" class="code-tag">q2</text> <line x1="66" y1="148" x2="338" y2="148" class="wire"/> <rect x="178" y="138" width="32" height="20" rx="4" class="qubit-node"/> <text x="194" y="152" text-anchor="middle" class="box-title">H</text> <text x="38" y="178" class="code-tag">q3</text> <line x1="66" y1="174" x2="338" y2="174" class="wire"/> <rect x="178" y="164" width="32" height="20" rx="4" class="qubit-node"/> <text x="194" y="178" text-anchor="middle" class="box-title">H</text> <rect x="28" y="208" width="328" height="52" rx="7" class="stage-purple"/> <text x="192" y="228" text-anchor="middle" class="box-title">Conjugates X_q &#8596; Z_q on all 4 qubits</text> <text x="192" y="248" text-anchor="middle" class="code-tag">Zero 2Q gates &#183; gadget distance = 2</text> <path d="M 374 144 L 408 144" class="conn" marker-end="url(#hsw-arr)"/> <rect x="412" y="14" width="514" height="260" rx="10" class="cluster-neutral"/> <text x="669" y="36" text-anchor="middle" class="hdr-neutral">INDUCED QODEC CONTRACT ON C4</text> <rect x="428" y="48" width="482" height="134" rx="8" class="stage-blue"/> <text x="669" y="68" text-anchor="middle" class="box-title">Logical Clifford Action (Hadamard + Qubit 0 &#8596; 1 Swap)</text> <text x="446" y="92" class="code-tag">x[0]: X_0 X_1 &#8594; Z_0 Z_1 = z[1]</text> <text x="680" y="92" class="code-tag">x[1]: X_0 X_2 &#8594; Z_0 Z_2 = z[0]</text> <text x="446" y="112" class="code-tag">z[0]: Z_0 Z_2 &#8594; X_0 X_2 = x[1]</text> <text x="680" y="112" class="code-tag">z[1]: Z_0 Z_1 &#8594; X_0 X_1 = x[0]</text> <line x1="444" y1="124" x2="894" y2="124" class="wire"/> <text x="669" y="143" text-anchor="middle" class="box-sub">Declared logical-index Clifford action:</text> <text x="669" y="164" text-anchor="middle" class="code-tag">Clifford({&quot;X_0&quot;: &quot;Z_1&quot;, &quot;Z_0&quot;: &quot;X_1&quot;, &quot;X_1&quot;: &quot;Z_0&quot;, &quot;Z_1&quot;: &quot;X_0&quot;})</text> <rect x="428" y="192" width="482" height="68" rx="8" class="stage-teal"/> <text x="669" y="210" text-anchor="middle" class="box-title">Stabilizer Swap Derived by ec.filled (s0: XXXX &#8596; s1: ZZZZ)</text> <text x="669" y="230" text-anchor="middle" class="code-tag">check 0: [out[0].stabilizers[0], in[0].stabilizers[1]]</text> <text x="669" y="248" text-anchor="middle" class="code-tag">check 1: [out[0].stabilizers[1], in[0].stabilizers[0]]</text> </svg>
