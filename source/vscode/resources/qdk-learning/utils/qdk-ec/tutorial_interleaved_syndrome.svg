<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" width="100%" style="max-width:100%;height:auto" class="qdk-ec-interleaved" role="img" data-asset="tutorial_interleaved_syndrome.svg" aria-label="Comparison between bare syndrome extraction where X_4 spreads to X_2 X_3 with two canceling Z-ancilla flips (check unflipped), and Reichardt's interleaved CNOT schedule where CX 1 to 5 runs before X_4 so only X_3 flips ancilla q5 (check flipped, gadget distance 2)."> <style> .qdk-ec-interleaved { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-interleaved .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-interleaved .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-interleaved .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-interleaved .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-interleaved .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-interleaved .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-interleaved .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-interleaved .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-interleaved .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-interleaved .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-interleaved .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-interleaved .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-interleaved .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-interleaved .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-interleaved .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-interleaved .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-interleaved .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-interleaved .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-interleaved .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-interleaved .badge-blue { fill: #1976d2; } .qdk-ec-interleaved .badge-teal { fill: #0d9488; } .qdk-ec-interleaved .badge-purple { fill: #7c3aed; } .qdk-ec-interleaved .badge-red { fill: #dc2626; } .qdk-ec-interleaved .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-interleaved .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-interleaved .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-interleaved .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-interleaved .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-interleaved .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-interleaved .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-interleaved .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <rect x="12" y="12" width="458" height="278" rx="10" class="cluster-red"/> <text x="241" y="34" text-anchor="middle" class="hdr-red">BARE SCHEDULE &#8212; CHECK UNFLIPPED (DIST = 1)</text> <text x="26" y="66" class="code-tag">q0</text> <line x1="64" y1="62" x2="394" y2="62" class="wire"/> <text x="26" y="90" class="code-tag">q1</text> <line x1="64" y1="86" x2="394" y2="86" class="wire"/> <text x="26" y="114" class="code-tag">q2</text> <line x1="64" y1="110" x2="394" y2="110" class="wire"/> <text x="26" y="138" class="code-tag">q3</text> <line x1="64" y1="134" x2="394" y2="134" class="wire"/> <text x="22" y="168" class="code-tag">q4(X)</text> <line x1="64" y1="164" x2="394" y2="164" class="wire"/> <text x="22" y="198" class="code-tag">q5(Z)</text> <line x1="64" y1="194" x2="394" y2="194" class="wire"/> <line x1="86" y1="164" x2="86" y2="62" class="gate-neutral"/> <circle cx="86" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="86" cy="62" r="7" class="qubit-node"/> <text x="86" y="66" text-anchor="middle" class="code-tag">+</text> <line x1="114" y1="164" x2="114" y2="86" class="gate-neutral"/> <circle cx="114" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="114" cy="86" r="7" class="qubit-node"/> <text x="114" y="90" text-anchor="middle" class="code-tag">+</text> <rect x="132" y="154" width="40" height="20" rx="4" class="badge-red"/> <text x="152" y="168" text-anchor="middle" class="badge-txt">X_4</text> <line x1="190" y1="164" x2="190" y2="110" class="gate-red"/> <circle cx="190" cy="164" r="4.5" fill="#dc2626"/> <circle cx="190" cy="110" r="7" class="qubit-node"/> <text x="190" y="114" text-anchor="middle" class="code-tag">+</text> <line x1="220" y1="164" x2="220" y2="134" class="gate-red"/> <circle cx="220" cy="164" r="4.5" fill="#dc2626"/> <circle cx="220" cy="134" r="7" class="qubit-node"/> <text x="220" y="138" text-anchor="middle" class="code-tag">+</text> <rect x="242" y="184" width="18" height="20" rx="3" class="qubit-node"/> <text x="251" y="198" text-anchor="middle" class="code-tag">H</text> <line x1="274" y1="62" x2="274" y2="194" class="gate-neutral"/> <circle cx="274" cy="62" r="4" fill="var(--qdk-fg)"/> <circle cx="274" cy="194" r="4" fill="var(--qdk-fg)"/> <line x1="300" y1="86" x2="300" y2="194" class="gate-neutral"/> <circle cx="300" cy="86" r="4" fill="var(--qdk-fg)"/> <circle cx="300" cy="194" r="4" fill="var(--qdk-fg)"/> <line x1="328" y1="110" x2="328" y2="194" class="gate-red" stroke-dasharray="4 2"/> <circle cx="328" cy="110" r="4.5" fill="#dc2626"/> <circle cx="328" cy="194" r="4.5" fill="#dc2626"/> <line x1="356" y1="134" x2="356" y2="194" class="gate-red" stroke-dasharray="4 2"/> <circle cx="356" cy="134" r="4.5" fill="#dc2626"/> <circle cx="356" cy="194" r="4.5" fill="#dc2626"/> <rect x="370" y="184" width="18" height="20" rx="3" class="qubit-node"/> <text x="379" y="198" text-anchor="middle" class="code-tag">H</text> <rect x="398" y="101" width="60" height="18" rx="4" class="badge-red"/> <text x="428" y="114" text-anchor="middle" class="badge-txt">X_2</text> <rect x="398" y="125" width="60" height="18" rx="4" class="badge-red"/> <text x="428" y="138" text-anchor="middle" class="badge-txt">X_3</text> <rect x="398" y="185" width="60" height="18" rx="4" class="stage-red"/> <text x="428" y="198" text-anchor="middle" class="code-tag">&#916;chk = 0</text> <rect x="26" y="218" width="430" height="58" rx="7" class="stage-red"/> <text x="241" y="239" text-anchor="middle" class="box-title">Both X_2 and X_3 flip q5 &#8594; two flips cancel (&#916;M5 = 0)</text> <text x="241" y="260" text-anchor="middle" class="code-tag">Leaves logical error X_2 X_3 (out[0].z[0]) &#183; checks = []</text> <rect x="490" y="12" width="458" height="278" rx="10" class="cluster-teal"/> <text x="719" y="34" text-anchor="middle" class="hdr-teal">INTERLEAVED SCHEDULE &#8212; CHECK FLIPPED (DIST = 2)</text> <text x="504" y="66" class="code-tag">q0</text> <line x1="542" y1="62" x2="872" y2="62" class="wire"/> <text x="504" y="90" class="code-tag">q1</text> <line x1="542" y1="86" x2="872" y2="86" class="wire"/> <text x="504" y="114" class="code-tag">q2</text> <line x1="542" y1="110" x2="872" y2="110" class="wire"/> <text x="504" y="138" class="code-tag">q3</text> <line x1="542" y1="134" x2="872" y2="134" class="wire"/> <text x="500" y="168" class="code-tag">q4(X)</text> <line x1="542" y1="164" x2="872" y2="164" class="wire"/> <text x="500" y="198" class="code-tag">q5(Z)</text> <line x1="542" y1="194" x2="872" y2="194" class="wire"/> <line x1="562" y1="164" x2="562" y2="62" class="gate-neutral"/> <circle cx="562" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="562" cy="62" r="7" class="qubit-node"/> <text x="562" y="66" text-anchor="middle" class="code-tag">+</text> <line x1="590" y1="110" x2="590" y2="194" class="gate-neutral"/> <circle cx="590" cy="110" r="4" fill="var(--qdk-fg)"/> <circle cx="590" cy="194" r="7" class="qubit-node"/> <text x="590" y="198" text-anchor="middle" class="code-tag">+</text> <line x1="618" y1="62" x2="618" y2="194" class="gate-neutral"/> <circle cx="618" cy="62" r="4" fill="var(--qdk-fg)"/> <circle cx="618" cy="194" r="7" class="qubit-node"/> <text x="618" y="198" text-anchor="middle" class="code-tag">+</text> <line x1="646" y1="86" x2="646" y2="194" class="gate-neutral"/> <circle cx="646" cy="86" r="4" fill="var(--qdk-fg)"/> <circle cx="646" cy="194" r="7" class="qubit-node"/> <text x="646" y="198" text-anchor="middle" class="code-tag">+</text> <line x1="674" y1="164" x2="674" y2="110" class="gate-neutral"/> <circle cx="674" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="674" cy="110" r="7" class="qubit-node"/> <text x="674" y="114" text-anchor="middle" class="code-tag">+</text> <rect x="692" y="154" width="40" height="20" rx="4" class="badge-red"/> <text x="712" y="168" text-anchor="middle" class="badge-txt">X_4</text> <line x1="752" y1="164" x2="752" y2="134" class="gate-red"/> <circle cx="752" cy="164" r="4.5" fill="#dc2626"/> <circle cx="752" cy="134" r="7" class="qubit-node"/> <text x="752" y="138" text-anchor="middle" class="code-tag">+</text> <line x1="784" y1="164" x2="784" y2="86" class="gate-red"/> <circle cx="784" cy="164" r="4.5" fill="#dc2626"/> <circle cx="784" cy="86" r="7" class="qubit-node"/> <text x="784" y="90" text-anchor="middle" class="code-tag">+</text> <line x1="824" y1="134" x2="824" y2="194" class="gate-teal"/> <circle cx="824" cy="134" r="4.8" fill="#0d9488"/> <circle cx="824" cy="194" r="7" class="qubit-node"/> <text x="824" y="198" text-anchor="middle" class="code-tag">+</text> <rect x="876" y="77" width="60" height="18" rx="4" class="badge-red"/> <text x="906" y="90" text-anchor="middle" class="badge-txt">X_1</text> <rect x="876" y="125" width="60" height="18" rx="4" class="badge-red"/> <text x="906" y="138" text-anchor="middle" class="badge-txt">X_3</text> <rect x="876" y="185" width="60" height="18" rx="4" class="badge-teal"/> <text x="906" y="198" text-anchor="middle" class="badge-txt">&#916;chk = 1</text> <rect x="504" y="218" width="430" height="58" rx="7" class="stage-teal"/> <text x="719" y="239" text-anchor="middle" class="box-title">CX 1&#8594;5 ran early, so only X_3 hits CX 3&#8594;5 to flip q5</text> <text x="719" y="260" text-anchor="middle" class="code-tag">Flips checks[1], checks[3] &#183; detected (gadget dist = 2)</text> </svg>
