<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 286" width="100%" style="max-width:100%;height:auto" class="qdk-ec-parity" role="img" data-asset="tutorial_parity_references.svg" aria-label="How qodec expresses checks and readouts as modulo-2 XOR sums over input block signs, circuit measurement bits, and output block signs."> <style> .qdk-ec-parity { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-parity .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-parity .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-parity .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-parity .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-parity .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-parity .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-parity .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-parity .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-parity .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-parity .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-parity .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-parity .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-parity .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-parity .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-parity .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-parity .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-parity .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-parity .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-parity .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-parity .badge-blue { fill: #1976d2; } .qdk-ec-parity .badge-teal { fill: #0d9488; } .qdk-ec-parity .badge-purple { fill: #7c3aed; } .qdk-ec-parity .badge-red { fill: #dc2626; } .qdk-ec-parity .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-parity .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-parity .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-parity .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-parity .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-parity .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-parity .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-parity .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <defs> <marker id="par-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"> <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/> </marker> </defs> <rect x="14" y="14" width="336" height="258" rx="10" class="cluster-neutral"/> <text x="182" y="36" text-anchor="middle" class="hdr-neutral">THREE BIT NAMESPACES (0 = +1, 1 = &#8722;1)</text> <rect x="28" y="48" width="308" height="64" rx="7" class="stage-blue"/> <text x="42" y="67" class="box-title">1. Input Block State &#8212; in[b]</text> <text x="42" y="85" class="code-tag">in[0].stabilizers[i]</text> <text x="192" y="85" class="box-sub">incoming stabilizer sign</text> <text x="42" y="102" class="code-tag">in[0].z[j], in[0].x[j]</text> <text x="192" y="102" class="box-sub">incoming Pauli frame</text> <rect x="28" y="122" width="308" height="64" rx="7" class="stage-teal"/> <text x="42" y="141" class="box-title">2. Circuit Measurements &#8212; circuit</text> <text x="42" y="160" class="code-tag">circuit.readouts[k]</text> <text x="42" y="177" class="box-sub">k-th classical measurement bit in circuit order</text> <rect x="28" y="196" width="308" height="64" rx="7" class="stage-blue"/> <text x="42" y="215" class="box-title">3. Output Block State &#8212; out[b]</text> <text x="42" y="233" class="code-tag">out[0].stabilizers[i]</text> <text x="196" y="233" class="box-sub">outgoing stabilizer sign</text> <text x="42" y="250" class="code-tag">out[0].z[j], out[0].x[j]</text> <text x="196" y="250" class="box-sub">outgoing Pauli frame</text> <path d="M 354 143 L 386 143" class="conn" marker-end="url(#par-arr)"/> <rect x="390" y="14" width="536" height="258" rx="10" class="cluster-neutral"/> <text x="658" y="36" text-anchor="middle" class="hdr-neutral">LISTS MEAN MODULO-2 XOR &#8212; C4 EXAMPLES</text> <rect x="406" y="48" width="504" height="64" rx="7" class="cluster-blue"/> <text x="420" y="67" class="box-title">Ancilla Check (syndrome): ancilla bit matches incoming sign</text> <text x="420" y="87" class="code-tag">[&quot;in[0].stabilizers[0]&quot;, &quot;circuit.readouts[0]&quot;]</text> <text x="420" y="104" class="box-sub">Asserts s0_in &#8853; r0 = 0 &#8594; chained across rounds without assuming r0 = 0</text> <rect x="406" y="122" width="504" height="64" rx="7" class="cluster-teal"/> <text x="420" y="141" class="box-title">Boundary Conservation Check (cx_all / syndrome): zero measurements</text> <text x="420" y="161" class="code-tag">[&quot;in[0].stabilizers[0]&quot;, &quot;out[0].stabilizers[0]&quot;]</text> <text x="420" y="178" class="box-sub">Asserts s0_in &#8853; s0_out = 0 &#8594; propagates stabilizer signs to the next gadget</text> <rect x="406" y="196" width="504" height="64" rx="7" class="cluster-purple"/> <text x="420" y="215" class="box-title">Observable Readout (measure_z_all, z[0] = Z_0 Z_2): value expression</text> <text x="420" y="235" class="code-tag">[&quot;in[0].z[0]&quot;, &quot;circuit.readouts[0]&quot;, &quot;circuit.readouts[2]&quot;]</text> <text x="420" y="252" class="box-sub">Defines outcome = z0_in &#8853; r0 &#8853; r2 &#8594; folds incoming software frame into Z_0 Z_2</text> </svg>
