<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 284" width="100%" style="max-width:100%;height:auto" class="qdk-ec-layers" role="img" data-asset="tutorial_qodec_layers.svg" aria-label="Qodec lowering chain connecting logical Q# and OpenQASM programs through a source logical ISA, gadgets, and a target physical ISA to noisy QDK simulation and decoding."> <style> .qdk-ec-layers { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-layers .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-layers .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-layers .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-layers .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-layers .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-layers .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-layers .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-layers .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-layers .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-layers .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-layers .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-layers .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-layers .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-layers .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-layers .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-layers .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-layers .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-layers .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-layers .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-layers .badge-blue { fill: #1976d2; } .qdk-ec-layers .badge-teal { fill: #0d9488; } .qdk-ec-layers .badge-purple { fill: #7c3aed; } .qdk-ec-layers .badge-red { fill: #dc2626; } .qdk-ec-layers .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-layers .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-layers .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-layers .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-layers .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-layers .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-layers .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-layers .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <defs> <marker id="lyr-arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"> <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--qdk-fg)"/> </marker> </defs> <rect x="14" y="20" width="176" height="132" rx="10" class="stage-purple"/> <text x="102" y="46" text-anchor="middle" class="box-title">Logical Program</text> <text x="102" y="68" text-anchor="middle" class="box-sub">Q# or OpenQASM 3</text> <text x="102" y="86" text-anchor="middle" class="box-sub">Compiled to QIR</text> <text x="102" y="114" text-anchor="middle" class="code-tag">qdk.qsharp</text> <text x="102" y="132" text-anchor="middle" class="code-tag">qdk.openqasm</text> <path d="M 192 86 L 222 86" class="conn" marker-end="url(#lyr-arr)"/> <rect x="226" y="12" width="468" height="148" rx="10" class="cluster-blue"/> <text x="460" y="32" text-anchor="middle" class="hdr-blue">QODEC PROTOCOL &#8212; LAYERED LOWERING MODEL</text> <rect x="240" y="44" width="132" height="102" rx="8" class="stage-blue"/> <text x="306" y="66" text-anchor="middle" class="box-title">Top Layer ISA</text> <text x="306" y="86" text-anchor="middle" class="box-sub">Encoded blocks</text> <text x="306" y="102" text-anchor="middle" class="box-sub">Formal actions</text> <text x="306" y="128" text-anchor="middle" class="code-tag">Code + Actions</text> <path d="M 374 95 L 392 95" class="conn" marker-end="url(#lyr-arr)"/> <rect x="394" y="44" width="132" height="102" rx="8" class="stage-teal"/> <text x="460" y="66" text-anchor="middle" class="box-title">Gadgets</text> <text x="460" y="86" text-anchor="middle" class="box-sub">Target circuits</text> <text x="460" y="102" text-anchor="middle" class="box-sub">Checks &amp; readouts</text> <text x="460" y="128" text-anchor="middle" class="code-tag">in / out / flags</text> <path d="M 528 95 L 546 95" class="conn" marker-end="url(#lyr-arr)"/> <rect x="548" y="44" width="132" height="102" rx="8" class="stage-blue"/> <text x="614" y="66" text-anchor="middle" class="box-title">Bottom Layer ISA</text> <text x="614" y="86" text-anchor="middle" class="box-sub">Physical qubits</text> <text x="614" y="102" text-anchor="middle" class="box-sub">Primitive gates</text> <text x="614" y="128" text-anchor="middle" class="code-tag">R, H, CX, CZ, M</text> <path d="M 696 86 L 726 86" class="conn" marker-end="url(#lyr-arr)"/> <rect x="730" y="20" width="176" height="132" rx="10" class="stage-purple"/> <text x="818" y="46" text-anchor="middle" class="box-title">Simulate &amp; Decode</text> <text x="818" y="68" text-anchor="middle" class="box-sub">Sample noisy shots</text> <text x="818" y="86" text-anchor="middle" class="box-sub">Infer corrections</text> <text x="818" y="114" text-anchor="middle" class="code-tag">qdk.simulation</text> <text x="818" y="132" text-anchor="middle" class="code-tag">run_qir &#183; deq</text> <path d="M 306 190 L 306 162" class="conn" marker-end="url(#lyr-arr)"/> <path d="M 460 190 L 460 162" class="conn" marker-end="url(#lyr-arr)"/> <path d="M 614 190 L 614 162" class="conn" marker-end="url(#lyr-arr)"/> <rect x="226" y="192" width="468" height="78" rx="8" class="cluster-teal"/> <text x="460" y="214" text-anchor="middle" class="hdr-teal">VERIFICATION &amp; ANALYSIS &#8212; qdk.ec</text> <text x="460" y="234" text-anchor="middle" class="box-sub">Builds baseline qodecs, derives equations, and audits noiseless consistency</text> <text x="306" y="256" text-anchor="middle" class="code-tag">CodeProfile &#183; build_qodec</text> <text x="460" y="256" text-anchor="middle" class="code-tag">GadgetProfile &#183; filled</text> <text x="614" y="256" text-anchor="middle" class="code-tag">ec.audit(protocol)</text> </svg>
