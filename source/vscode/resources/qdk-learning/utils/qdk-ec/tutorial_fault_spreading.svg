<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="100%" style="max-width:680px;height:auto" class="qdk-ec-fault" role="img" data-asset="tutorial_fault_spreading.svg" aria-label="Six-wire bare syndrome extraction circuit showing X_4 after CX 4 1 spreading to X_2 X_3, which conjugates through CZ 5 2 and CZ 5 3 to two canceling Z phase flips on ancilla q5, leaving the Z check unflipped."> <style> .qdk-ec-fault { --qdk-fg: var(--vscode-editor-foreground, var(--jp-content-font-color1, currentColor)); --qdk-muted: color-mix(in srgb, var(--qdk-fg) 80%, transparent); --qdk-border: color-mix(in srgb, var(--qdk-fg) 30%, transparent); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; } .qdk-ec-fault .cluster-blue { fill: color-mix(in srgb, #1976d2 8%, transparent); stroke: color-mix(in srgb, #1976d2 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-fault .cluster-teal { fill: color-mix(in srgb, #0d9488 8%, transparent); stroke: color-mix(in srgb, #0d9488 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-fault .cluster-purple { fill: color-mix(in srgb, #7c3aed 8%, transparent); stroke: color-mix(in srgb, #7c3aed 58%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-fault .cluster-neutral { fill: color-mix(in srgb, var(--qdk-fg) 4%, transparent); stroke: color-mix(in srgb, var(--qdk-fg) 32%, transparent); stroke-width: 1.8; } .qdk-ec-fault .cluster-red { fill: color-mix(in srgb, #dc2626 9%, transparent); stroke: color-mix(in srgb, #dc2626 62%, var(--qdk-fg)); stroke-width: 2; } .qdk-ec-fault .stage-blue { fill: color-mix(in srgb, #1976d2 18%, transparent); stroke: color-mix(in srgb, #1976d2 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-fault .stage-teal { fill: color-mix(in srgb, #0d9488 18%, transparent); stroke: color-mix(in srgb, #0d9488 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-fault .stage-purple { fill: color-mix(in srgb, #7c3aed 18%, transparent); stroke: color-mix(in srgb, #7c3aed 80%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-fault .stage-red { fill: color-mix(in srgb, #dc2626 16%, transparent); stroke: color-mix(in srgb, #dc2626 78%, var(--qdk-fg)); stroke-width: 1.8; } .qdk-ec-fault .loop-x { fill: color-mix(in srgb, #1976d2 20%, transparent); stroke: color-mix(in srgb, #1976d2 85%, var(--qdk-fg)); stroke-width: 2.2; } .qdk-ec-fault .loop-z { fill: color-mix(in srgb, #0d9488 20%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2.2; stroke-dasharray: 6 3; } .qdk-ec-fault .hdr-blue { fill: color-mix(in srgb, #1976d2 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-fault .hdr-teal { fill: color-mix(in srgb, #0d9488 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-fault .hdr-purple { fill: color-mix(in srgb, #7c3aed 70%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-fault .hdr-neutral { fill: var(--qdk-fg); font-size: 12.2px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-fault .hdr-red { fill: color-mix(in srgb, #dc2626 75%, var(--qdk-fg)); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; } .qdk-ec-fault .box-title { fill: var(--qdk-fg); font-size: 11.6px; font-weight: 700; } .qdk-ec-fault .box-sub { fill: var(--qdk-muted); font-size: 10px; } .qdk-ec-fault .code-tag { fill: var(--qdk-fg); font-family: Consolas, "Courier New", monospace; font-size: 9.4px; font-weight: 600; } .qdk-ec-fault .badge-blue { fill: #1976d2; } .qdk-ec-fault .badge-teal { fill: #0d9488; } .qdk-ec-fault .badge-purple { fill: #7c3aed; } .qdk-ec-fault .badge-red { fill: #dc2626; } .qdk-ec-fault .badge-txt { fill: #ffffff; font-size: 9.6px; font-weight: 700; } .qdk-ec-fault .conn { stroke: color-mix(in srgb, var(--qdk-fg) 68%, transparent); stroke-width: 2.2; fill: none; } .qdk-ec-fault .wire { stroke: color-mix(in srgb, var(--qdk-fg) 48%, transparent); stroke-width: 1.5; fill: none; } .qdk-ec-fault .gate-neutral { stroke: color-mix(in srgb, var(--qdk-fg) 78%, transparent); stroke-width: 1.8; fill: none; } .qdk-ec-fault .gate-red { stroke: #dc2626; stroke-width: 2.3; fill: none; } .qdk-ec-fault .gate-teal { stroke: #0d9488; stroke-width: 2.4; fill: none; } .qdk-ec-fault .qubit-node { fill: var(--vscode-editor-background, #1e1e1e); stroke: color-mix(in srgb, var(--qdk-fg) 75%, transparent); stroke-width: 2; } .qdk-ec-fault .anc-node { fill: color-mix(in srgb, #0d9488 22%, transparent); stroke: color-mix(in srgb, #0d9488 85%, var(--qdk-fg)); stroke-width: 2; } </style> <rect x="12" y="12" width="656" height="282" rx="10" class="cluster-red"/> <text x="340" y="34" text-anchor="middle" class="hdr-red">BARE SYNDROME SCHEDULE &#8212; SPREADING FAULT UNDETECTED (GADGET DISTANCE = 1)</text> <text x="28" y="66" class="code-tag">q0</text> <line x1="78" y1="62" x2="572" y2="62" class="wire"/> <text x="28" y="90" class="code-tag">q1</text> <line x1="78" y1="86" x2="572" y2="86" class="wire"/> <text x="28" y="114" class="code-tag">q2</text> <line x1="78" y1="110" x2="572" y2="110" class="wire"/> <text x="28" y="138" class="code-tag">q3</text> <line x1="78" y1="134" x2="572" y2="134" class="wire"/> <text x="24" y="168" class="code-tag">q4 (X)</text> <line x1="78" y1="164" x2="572" y2="164" class="wire"/> <text x="24" y="198" class="code-tag">q5 (Z)</text> <line x1="78" y1="194" x2="572" y2="194" class="wire"/> <rect x="86" y="154" width="22" height="20" rx="4" class="qubit-node"/> <text x="97" y="168" text-anchor="middle" class="code-tag">H</text> <line x1="126" y1="164" x2="126" y2="62" class="gate-neutral"/> <circle cx="126" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="126" cy="62" r="7" class="qubit-node"/> <text x="126" y="66" text-anchor="middle" class="code-tag">+</text> <line x1="162" y1="164" x2="162" y2="86" class="gate-neutral"/> <circle cx="162" cy="164" r="4" fill="var(--qdk-fg)"/> <circle cx="162" cy="86" r="7" class="qubit-node"/> <text x="162" y="90" text-anchor="middle" cla