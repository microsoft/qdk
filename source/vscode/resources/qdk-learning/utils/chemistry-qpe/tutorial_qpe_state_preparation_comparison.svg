<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760" role="img" class="qdk-chemistry-state-preparation">
<style>
.qdk-chemistry-state-preparation { --qdk-host-foreground: var(--vscode-editor-foreground, var(--jp-widgets-color, currentColor)); --circuit-fg: var(--qdk-host-foreground); --circuit-bg: transparent; --unitary-fill: transparent; --unitary-text: var(--qdk-host-foreground); --measure-fill: #0067b8; --measure-text: #ffffff; --ket-fill: #0067b8; --ket-text: #ffffff; }
.qdk-chemistry-state-preparation line, .qdk-chemistry-state-preparation circle, .qdk-chemistry-state-preparation rect { stroke: var(--circuit-fg); stroke-width: 1; }
.qdk-chemistry-state-preparation text { fill: var(--circuit-fg); dominant-baseline: middle; text-anchor: middle; font-family: "Segoe UI", Arial, sans-serif; }
.qdk-chemistry-state-preparation .qs-mathtext { font-family: "Cambria Math", "STIX Two Math", serif; font-style: italic; }
.qdk-chemistry-state-preparation .gate .qs-group-label { fill: var(--circuit-fg); text-anchor: start; }
.qdk-chemistry-state-preparation .gate-unitary { fill: var(--unitary-fill); }
.qdk-chemistry-state-preparation .gate text { fill: var(--unitary-text); }
.qdk-chemistry-state-preparation .control-line, .qdk-chemistry-state-preparation .control-dot { fill: var(--circuit-fg); }
.qdk-chemistry-state-preparation .oplus > line, .qdk-chemistry-state-preparation .oplus > circle { fill: var(--circuit-bg); stroke: var(--circuit-fg); stroke-width: 2; }
.qdk-chemistry-state-preparation .gate-measure { fill: var(--measure-fill); }
.qdk-chemistry-state-preparation .qs-line-measure, .qdk-chemistry-state-preparation .arc-measure { stroke: var(--measure-text); fill: none; }
.qdk-chemistry-state-preparation .gate-ket { fill: var(--ket-fill); }
.qdk-chemistry-state-preparation text.ket-text { fill: var(--ket-text); stroke: none; }
.qdk-chemistry-state-preparation .register-classical { stroke-width: 0.5; }
.qdk-chemistry-state-preparation .gate-collapse, .qdk-chemistry-state-preparation .gate-expand, .qdk-chemistry-state-preparation .dropzone-layer { display: none; }
</style>
