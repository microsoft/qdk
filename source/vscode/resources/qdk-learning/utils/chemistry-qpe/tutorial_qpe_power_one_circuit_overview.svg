<style>
.qdk-chemistry-power-one-circuit { --qdk-host-foreground: var(--vscode-editor-foreground, var(--jp-widgets-color, currentColor)); --circuit-fg: var(--qdk-host-foreground); --circuit-bg: transparent; --unitary-fill: transparent; --unitary-text: var(--qdk-host-foreground); --measure-fill: #0067b8; --measure-text: #ffffff; --ket-fill: #0067b8; --ket-text: #ffffff; }
.qdk-chemistry-power-one-circuit line, .qdk-chemistry-power-one-circuit circle, .qdk-chemistry-power-one-circuit rect { stroke: var(--circuit-fg); stroke-width: 1; }
.qdk-chemistry-power-one-circuit text { fill: var(--circuit-fg); dominant-baseline: middle; text-anchor: middle; font-family: "Segoe UI", Arial, sans-serif; }
.qdk-chemistry-power-one-circuit .qs-mathtext { font-family: "Cambria Math", "STIX Two Math", serif; font-style: italic; }
.qdk-chemistry-power-one-circuit .gate .qs-group-label { fill: var(--circuit-fg); text-anchor: start; }
.qdk-chemistry-power-one-circuit .gate-unitary { fill: var(--unitary-fill); }
.qdk-chemistry-power-one-circuit .gate text { fill: var(--unitary-text); }
.qdk-chemistry-power-one-circuit .control-line, .qdk-chemistry-power-one-circuit .control-dot { fill: var(--circuit-fg); }
.qdk-chemistry-power-one-circuit .oplus > line, .qdk-chemistry-power-one-circuit .oplus > circle { fill: var(--circuit-bg); stroke: var(--circuit-fg); stroke-width: 2; }
.qdk-chemistry-power-one-circuit .gate-measure { fill: var(--measure-fill); }
.qdk-chemistry-power-one-circuit .qs-line-measure, .qdk-chemistry-power-one-circuit .arc-measure { stroke: var(--measure-text); fill: none; }
.qdk-chemistry-power-one-circuit .gate-ket { fill: var(--ket-fill); }
.qdk-chemistry-power-one-circuit text.ket-text { fill: var(--ket-text); stroke: none; }
.qdk-chemistry-power-one-circuit .register-classical { stroke-width: 0.5; }
.qdk-chemistry-power-one-circuit .gate-collapse, .qdk-chemistry-power-one-circuit .gate-expand, .qdk-chemistry-power-one-circuit .dropzone-layer { display: none; }
</style>
