# Majorana zero modes (MZMs) on tetron islands.
#
# qodec actions are qubit Pauli strings, so the four MZMs gamma_0..gamma_3 of a
# tetron are mapped to two qubits with the Jordan-Wigner transformation:
#
#   gamma_0 = X_0    gamma_1 = Y_0    gamma_2 = Z_0 X_1    gamma_3 = Z_0 Y_1
#
# A loop measuring MZMs a and b measures the parity i gamma_a gamma_b, which is
# the Pauli below. Its +1 eigenvalue is outcome 0.
#
#   pair   i gamma_a gamma_b        pair   i gamma_a gamma_b
#   0 1    -Z_0                     2 3    -Z_1
#   1 2    -X_0 X_1                 0 3    Y_0 Y_1
#   0 2    Y_0 X_1                  1 3    -X_0 Y_1
#
# The tetron's total fermion parity is (i gamma_0 gamma_1)(i gamma_2 gamma_3)
# = Z_0 Z_1. Every instruction below uses an even number of MZMs from each
# tetron, so it commutes with that parity, and the per-tetron Jordan-Wigner
# map is exact even though it lets MZMs on different tetrons commute.
name: mzm
description: Physical instruction set for Majorana zero modes on tetron islands.
blocks: { tetron: 2 }
instructions:
  - mnemonic: prepare
    description: Initialize a tetron with i gamma_0 gamma_1 = i gamma_2 gamma_3 = +1 (even total parity).
    out: [tetron]
    action: [stabilize: [-Z_0, -Z_1]]
  - mnemonic: release
    description: Stop using a tetron, discarding its state.
    in: [tetron]
  - mnemonic: measure_01
    description: One-tetron loop measuring i gamma_0 gamma_1.
    in: [tetron]
    out: [tetron]
    action: [observe: -Z_0]
  - mnemonic: measure_23
    description: One-tetron loop measuring i gamma_2 gamma_3.
    in: [tetron]
    out: [tetron]
    action: [observe: -Z_1]
  - mnemonic: measure_12
    description: One-tetron loop measuring i gamma_1 gamma_2.
    in: [tetron]
    out: [tetron]
    action: [observe: -X_0 X_1]
  - mnemonic: measure_03
    description: One-tetron loop measuring i gamma_0 gamma_3.
    in: [tetron]
    out: [tetron]
    action: [observe: Y_0 Y_1]
  - mnemonic: measure_02
    description: One-tetron loop measuring i gamma_0 gamma_2.
    in: [tetron]
    out: [tetron]
    action: [observe: Y_0 X_1]
  - mnemonic: measure_13
    description: One-tetron loop measuring i gamma_1 gamma_3.
    in: [tetron]
    out: [tetron]
    action: [observe: -X_0 Y_1]
  - mnemonic: measure_01_01
    description: Two-tetron loop measuring (i gamma_0 gamma_1) on both tetrons.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: Z_0 Z_2]
  - mnemonic: measure_12_12
    description: Two-tetron loop measuring (i gamma_1 gamma_2) on both tetrons.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: X_0 X_1 X_2 X_3]
  - mnemonic: measure_12_01
    description: Two-tetron loop measuring (i gamma_1 gamma_2) on the first tetron and (i gamma_0 gamma_1) on the second.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: X_0 X_1 Z_2]
