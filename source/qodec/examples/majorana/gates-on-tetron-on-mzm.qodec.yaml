# Three layers: a common gate set on top, lowered onto measurement-only
# tetrons, lowered onto their Majorana zero modes. The bottom two layers are
# those of tetron-on-mzm.qodec.yaml.
name: gates-on-tetron-on-mzm
description: Common gates on Majorana tetron qubits, lowered to Majorana zero modes.
layers:
  - instruction_set: gates.isa.yaml
    codes:
      qubit: qubit.code.yaml
    gadgets:
      prepare_z: gates/prepare_z.gadget.yaml
      measure_z: gates/measure_z.gadget.yaml
      measure_x: gates/measure_x.gadget.yaml
      x: gates/x.gadget.yaml
      "y": gates/y.gadget.yaml
      z: gates/z.gadget.yaml
      h: gates/h.gadget.yaml
      s: gates/s.gadget.yaml
      cx: gates/cx.gadget.yaml
  - instruction_set: tetron.isa.yaml
    codes:
      tetron: tetron.code.yaml
    gadgets:
      prepare_z: tetron/prepare_z.gadget.yaml
      release: tetron/release.gadget.yaml
      measure_z: tetron/measure_z.gadget.yaml
      measure_x: tetron/measure_x.gadget.yaml
      measure_y: tetron/measure_y.gadget.yaml
      measure_zz: tetron/measure_zz.gadget.yaml
      measure_xx: tetron/measure_xx.gadget.yaml
      measure_xz: tetron/measure_xz.gadget.yaml
  - instruction_set: mzm.isa.yaml
