# Majorana tetron qubits.
#
# A tetron is an island hosting four Majorana zero modes (MZMs)
# gamma_0..gamma_3 whose total fermion parity is fixed, so it stores exactly one
# qubit. This instruction set treats each tetron as that qubit and hides the
# MZMs: see mzm.isa.yaml for the same hardware at the MZM level.
#
# Tetrons are measurement-only. There are no unitary gates; every operation is
# an interferometric loop measurement of a Majorana parity, which in qubit
# language is a Pauli measurement:
#
#   Z = i gamma_0 gamma_1    X = i gamma_1 gamma_2    Y = i gamma_0 gamma_2
#
# Two-tetron loops span both islands and measure products such as Z Z.
# Loop measurements are not destructive, so each one keeps its tetrons.
name: tetron
description: Physical instruction set for measurement-only Majorana tetron qubits.
blocks: { tetron: 1 }
instructions:
  - mnemonic: prepare_z
    description: Initialize a tetron in |0>, by measuring Z and correcting the Pauli frame.
    out: [tetron]
    action: [stabilize: Z_0]
  - mnemonic: release
    description: Stop using a tetron, discarding its state.
    in: [tetron]
  - mnemonic: measure_z
    description: One-tetron loop measuring Z = i gamma_0 gamma_1.
    in: [tetron]
    out: [tetron]
    action: [observe: Z_0]
  - mnemonic: measure_x
    description: One-tetron loop measuring X = i gamma_1 gamma_2.
    in: [tetron]
    out: [tetron]
    action: [observe: X_0]
  - mnemonic: measure_y
    description: One-tetron loop measuring Y = i gamma_0 gamma_2.
    in: [tetron]
    out: [tetron]
    action: [observe: Y_0]
  - mnemonic: measure_zz
    description: Two-tetron loop measuring the joint parity Z Z.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: Z_0 Z_1]
  - mnemonic: measure_xx
    description: Two-tetron loop measuring the joint parity X X.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: X_0 X_1]
  - mnemonic: measure_xz
    description: Two-tetron loop measuring X on the first tetron times Z on the second.
    in: [tetron, tetron]
    out: [tetron, tetron]
    action: [observe: X_0 Z_1]
