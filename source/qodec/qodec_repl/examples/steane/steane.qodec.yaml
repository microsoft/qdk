# Steane [[7,1,3]] code — single-file qodec bundle.
#
# The canonical CSS code (Steane 1996), built from the classical [7,4,3]
# Hamming code: its three X stabilizers and three Z stabilizers share the same
# Hamming support pattern. The Steane code's headline property is a *fully
# transversal Clifford group* — logical H, S, and CNOT are each realized by
# applying the physical gate qubit-by-qubit. This bundle showcases transversal
# H (single block) and transversal CNOT (between two blocks); transversal S is
# noted but omitted to avoid the S/S-dagger sign convention.
#
# It also carries a flag-qubit fault-tolerant syndrome round (`idle_ft`): each
# weight-4 stabilizer is measured with a syndrome+flag ancilla pair (Chao-
# Reichardt), the six deterministic-0 flags heralding hook errors. This is the
# qodec `flags` mechanism used for fault-tolerant EXTRACTION (not post-selection),
# contrasted with the plain `idle` round.
#
# References: A. M. Steane, "Error correcting codes in quantum theory,"
# Phys. Rev. Lett. 77, 793 (1996); R. Chao, B. W. Reichardt, "Quantum error
# correction with only two extra qubits," Phys. Rev. Lett. 121, 050502 (2018).
---
qodec.yaml:
  name: steane
  description: >-
    The Steane [[7,1,3]] code — the canonical CSS / colour code with a fully
    transversal Clifford group (transversal H and CNOT) plus a flag-qubit
    fault-tolerant syndrome round (idle_ft, Chao-Reichardt).
  layers:
    - instruction_set: steane.isa.yaml
      codes:
        steane: steane.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        prepare_x: prepare_x.gadget.yaml
        idle: idle.gadget.yaml
        idle_ft: idle_ft.gadget.yaml
        measure_z: measure_z.gadget.yaml
        measure_x: measure_x.gadget.yaml
        h: h.gadget.yaml
        cnot: cnot.gadget.yaml
    - instruction_set: ../stim.isa.yaml
---
steane.isa.yaml:
  name: steane
  description: Logical instruction set for the Steane [[7,1,3]] code.
  blocks: { steane: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [steane]
      action: [stabilize: Z_0]
    - mnemonic: prepare_x
      description: Prepare the logical |+> state.
      out: [steane]
      action: [stabilize: X_0]
    - mnemonic: idle
      description: One full syndrome-extraction round (identity logical action).
      in: [steane]
      out: [steane]
    - mnemonic: idle_ft
      description: >-
        One fault-tolerant syndrome-extraction round (Chao-Reichardt). Each
        weight-4 stabilizer is measured with a flag qubit; the six flags herald
        hook errors.
      in: [steane]
      out: [steane]
      flags: [flag_0, flag_1, flag_2, flag_3, flag_4, flag_5]
    - mnemonic: measure_z
      description: Destructive measurement of the logical Z observable.
      in: [steane]
      action: [observe: Z_0]
    - mnemonic: measure_x
      description: Destructive measurement of the logical X observable.
      in: [steane]
      action: [observe: X_0]
    - mnemonic: h
      description: Transversal logical Hadamard.
      in: [steane]
      out: [steane]
      action: [clifford: { X_0: Z_0, Z_0: X_0 }]
    - mnemonic: cnot
      description: Transversal logical CNOT (control = logical qubit 0, target = logical qubit 1).
      in: [steane, steane]
      out: [steane, steane]
      action: [clifford: { X_0: X_0 X_1, Z_1: Z_0 Z_1 }]
---
steane.code.yaml:
  name: steane
  description: >-
    Steane [[7,1,3]] CSS code from the [7,4,3] Hamming code. Stabilizers 0-2 are
    X-type, 3-5 are Z-type (same Hamming support). Logical X = X_0…X_6,
    logical Z = Z_0…Z_6.
  stabilizers:
    - X_0 X_2 X_4 X_6
    - X_1 X_2 X_5 X_6
    - X_3 X_4 X_5 X_6
    - Z_0 Z_2 Z_4 Z_6
    - Z_1 Z_2 Z_5 Z_6
    - Z_3 Z_4 Z_5 Z_6
  x: [X_0 X_1 X_2 X_3 X_4 X_5 X_6]
  z: [Z_0 Z_1 Z_2 Z_3 Z_4 Z_5 Z_6]
---
# Prepare |0_L>: reset all data to |0> (fixing the Z stabilizers and logical Z),
# then project by measuring the three X stabilizers (ancillas 7-9). The measured
# signs seed the outgoing X-stabilizer frame.
prepare_z.gadget.yaml:
  circuit:
    source:
      - R: [0]
      - R: [1]
      - R: [2]
      - R: [3]
      - R: [4]
      - R: [5]
      - R: [6]
      - R: [7]
      - R: [8]
      - R: [9]
      - H: [7]
      - H: [8]
      - H: [9]
      - CX: [7, 0]
      - CX: [7, 2]
      - CX: [7, 4]
      - CX: [7, 6]
      - CX: [8, 1]
      - CX: [8, 2]
      - CX: [8, 5]
      - CX: [8, 6]
      - CX: [9, 3]
      - CX: [9, 4]
      - CX: [9, 5]
      - CX: [9, 6]
      - H: [7]
      - H: [8]
      - H: [9]
      - M: [7]
      - M: [8]
      - M: [9]
  checks:
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[2]"]
    - ["out[0].stabilizers[3]"]
    - ["out[0].stabilizers[4]"]
    - ["out[0].stabilizers[5]"]
---
# Prepare |+_L>: reset all data to |+> (fixing the X stabilizers and logical X),
# then project by measuring the three Z stabilizers (ancillas 10-12).
prepare_x.gadget.yaml:
  circuit:
    source:
      - R: [0]
      - R: [1]
      - R: [2]
      - R: [3]
      - R: [4]
      - R: [5]
      - R: [6]
      - R: [10]
      - R: [11]
      - R: [12]
      - H: [0]
      - H: [1]
      - H: [2]
      - H: [3]
      - H: [4]
      - H: [5]
      - H: [6]
      - CX: [0, 10]
      - CX: [2, 10]
      - CX: [4, 10]
      - CX: [6, 10]
      - CX: [1, 11]
      - CX: [2, 11]
      - CX: [5, 11]
      - CX: [6, 11]
      - CX: [3, 12]
      - CX: [4, 12]
      - CX: [5, 12]
      - CX: [6, 12]
      - M: [10]
      - M: [11]
      - M: [12]
  checks:
    - ["circuit.readouts[0]", "out[0].stabilizers[3]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[4]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[5]"]
    - ["out[0].stabilizers[0]"]
    - ["out[0].stabilizers[1]"]
    - ["out[0].stabilizers[2]"]
---
# One full syndrome round: three X stabilizers (ancillas 7-9 in |+>) and three
# Z stabilizers (ancillas 10-12). readouts[0..5] are stabilizers 0..5.
idle.gadget.yaml:
  circuit:
    source:
      - R: [7]
      - R: [8]
      - R: [9]
      - R: [10]
      - R: [11]
      - R: [12]
      - H: [7]
      - H: [8]
      - H: [9]
      - CX: [7, 0]
      - CX: [7, 2]
      - CX: [7, 4]
      - CX: [7, 6]
      - CX: [8, 1]
      - CX: [8, 2]
      - CX: [8, 5]
      - CX: [8, 6]
      - CX: [9, 3]
      - CX: [9, 4]
      - CX: [9, 5]
      - CX: [9, 6]
      - CX: [0, 10]
      - CX: [2, 10]
      - CX: [4, 10]
      - CX: [6, 10]
      - CX: [1, 11]
      - CX: [2, 11]
      - CX: [5, 11]
      - CX: [6, 11]
      - CX: [3, 12]
      - CX: [4, 12]
      - CX: [5, 12]
      - CX: [6, 12]
      - H: [7]
      - H: [8]
      - H: [9]
      - M: [7]
      - M: [8]
      - M: [9]
      - M: [10]
      - M: [11]
      - M: [12]
  checks:
    - ["circuit.readouts[0]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "in[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "in[0].stabilizers[2]"]
    - ["circuit.readouts[3]", "in[0].stabilizers[3]"]
    - ["circuit.readouts[4]", "in[0].stabilizers[4]"]
    - ["circuit.readouts[5]", "in[0].stabilizers[5]"]
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[1]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[2]"]
    - ["circuit.readouts[3]", "out[0].stabilizers[3]"]
    - ["circuit.readouts[4]", "out[0].stabilizers[4]"]
    - ["circuit.readouts[5]", "out[0].stabilizers[5]"]
---
# idle_ft: one fault-tolerant syndrome round (Chao-Reichardt). Each of the six
# weight-4 stabilizers is measured with a syndrome ancilla AND a flag ancilla. The
# syndrome outcomes are cross-round detectors / carry-forward (checks); the six
# flag outcomes are deterministic-0 flags that fire on a hook error. Readout layout
# per stabilizer i: syndrome = circuit.readouts[2i], flag = circuit.readouts[2i+1].
idle_ft.gadget.yaml:
  circuit:
    source:
      - R: [7]
      - H: [7]
      - R: [8]
      - CX: [7, 8]
      - CX: [7, 0]
      - CX: [7, 2]
      - CX: [7, 4]
      - CX: [7, 6]
      - CX: [7, 8]
      - H: [7]
      - M: [7]
      - M: [8]
      - R: [9]
      - H: [9]
      - R: [10]
      - CX: [9, 10]
      - CX: [9, 1]
      - CX: [9, 2]
      - CX: [9, 5]
      - CX: [9, 6]
      - CX: [9, 10]
      - H: [9]
      - M: [9]
      - M: [10]
      - R: [11]
      - H: [11]
      - R: [12]
      - CX: [11, 12]
      - CX: [11, 3]
      - CX: [11, 4]
      - CX: [11, 5]
      - CX: [11, 6]
      - CX: [11, 12]
      - H: [11]
      - M: [11]
      - M: [12]
      - R: [13]
      - R: [14]
      - H: [14]
      - CX: [14, 13]
      - CX: [0, 13]
      - CX: [2, 13]
      - CX: [4, 13]
      - CX: [6, 13]
      - CX: [14, 13]
      - M: [13]
      - MX: [14]
      - R: [15]
      - R: [16]
      - H: [16]
      - CX: [16, 15]
      - CX: [1, 15]
      - CX: [2, 15]
      - CX: [5, 15]
      - CX: [6, 15]
      - CX: [16, 15]
      - M: [15]
      - MX: [16]
      - R: [17]
      - R: [18]
      - H: [18]
      - CX: [18, 17]
      - CX: [3, 17]
      - CX: [4, 17]
      - CX: [5, 17]
      - CX: [6, 17]
      - CX: [18, 17]
      - M: [17]
      - MX: [18]
  checks:
    - ["circuit.readouts[0]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[2]", "in[0].stabilizers[1]"]
    - ["circuit.readouts[4]", "in[0].stabilizers[2]"]
    - ["circuit.readouts[6]", "in[0].stabilizers[3]"]
    - ["circuit.readouts[8]", "in[0].stabilizers[4]"]
    - ["circuit.readouts[10]", "in[0].stabilizers[5]"]
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[2]", "out[0].stabilizers[1]"]
    - ["circuit.readouts[4]", "out[0].stabilizers[2]"]
    - ["circuit.readouts[6]", "out[0].stabilizers[3]"]
    - ["circuit.readouts[8]", "out[0].stabilizers[4]"]
    - ["circuit.readouts[10]", "out[0].stabilizers[5]"]
  readouts:
    - flag_0: ["circuit.readouts[1]"]
    - flag_1: ["circuit.readouts[3]"]
    - flag_2: ["circuit.readouts[5]"]
    - flag_3: ["circuit.readouts[7]"]
    - flag_4: ["circuit.readouts[9]"]
    - flag_5: ["circuit.readouts[11]"]
---
# Destructive logical-Z readout: measure all data in Z. The three Z stabilizers
# (3,4,5) become deterministic checks; logical Z = Z_0…Z_6.
measure_z.gadget.yaml:
  circuit:
    source:
      - M: [0]
      - M: [1]
      - M: [2]
      - M: [3]
      - M: [4]
      - M: [5]
      - M: [6]
  checks:
    - ["circuit.readouts[0,2,4,6]", "in[0].stabilizers[3]"]
    - ["circuit.readouts[1,2,5,6]", "in[0].stabilizers[4]"]
    - ["circuit.readouts[3,4,5,6]", "in[0].stabilizers[5]"]
  readouts:
    - ["circuit.readouts[0:7]", "in[0].z[0]"]
---
# Destructive logical-X readout: measure all data in X. The three X stabilizers
# (0,1,2) become deterministic checks; logical X = X_0…X_6.
measure_x.gadget.yaml:
  circuit:
    source:
      - MX: [0]
      - MX: [1]
      - MX: [2]
      - MX: [3]
      - MX: [4]
      - MX: [5]
      - MX: [6]
  checks:
    - ["circuit.readouts[0,2,4,6]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1,2,5,6]", "in[0].stabilizers[1]"]
    - ["circuit.readouts[3,4,5,6]", "in[0].stabilizers[2]"]
  readouts:
    - ["circuit.readouts[0:7]", "in[0].x[0]"]
---
# Transversal logical Hadamard: physical H on every data qubit. Its decoding
# surface is derivable from the code and is left implicit.
h.gadget.yaml:
  circuit:
    source:
      - H: [0]
      - H: [1]
      - H: [2]
      - H: [3]
      - H: [4]
      - H: [5]
      - H: [6]
  checks:
    - ["in[0].stabilizers[3]", "out[0].stabilizers[0]"]
    - ["in[0].stabilizers[4]", "out[0].stabilizers[1]"]
    - ["in[0].stabilizers[5]", "out[0].stabilizers[2]"]
    - ["in[0].stabilizers[0]", "out[0].stabilizers[3]"]
    - ["in[0].stabilizers[1]", "out[0].stabilizers[4]"]
    - ["in[0].stabilizers[2]", "out[0].stabilizers[5]"]
---
# Transversal logical CNOT between two blocks: physical CX between corresponding
# qubits of block 0 (qubits 0-6) and block 1 (qubits 7-13).
cnot.gadget.yaml:
  circuit:
    source:
      - CX: [0, 7]
      - CX: [1, 8]
      - CX: [2, 9]
      - CX: [3, 10]
      - CX: [4, 11]
      - CX: [5, 12]
      - CX: [6, 13]
  checks:
    - ["in[0].stabilizers[0]", "in[1].stabilizers[0]", "out[0].stabilizers[0]"]
    - ["in[0].stabilizers[1]", "in[1].stabilizers[1]", "out[0].stabilizers[1]"]
    - ["in[0].stabilizers[2]", "in[1].stabilizers[2]", "out[0].stabilizers[2]"]
    - ["in[0].stabilizers[3]", "out[0].stabilizers[3]"]
    - ["in[0].stabilizers[4]", "out[0].stabilizers[4]"]
    - ["in[0].stabilizers[5]", "out[0].stabilizers[5]"]
    - ["in[1].stabilizers[0]", "out[1].stabilizers[0]"]
    - ["in[1].stabilizers[1]", "out[1].stabilizers[1]"]
    - ["in[1].stabilizers[2]", "out[1].stabilizers[2]"]
    - ["in[0].stabilizers[3]", "in[1].stabilizers[3]", "out[1].stabilizers[3]"]
    - ["in[0].stabilizers[4]", "in[1].stabilizers[4]", "out[1].stabilizers[4]"]
    - ["in[0].stabilizers[5]", "in[1].stabilizers[5]", "out[1].stabilizers[5]"]
