name: C6
description: |
  Knill's C6 [[6,2,2]] error-detecting code (Nature 434, 2005).
  Six physical qubits arranged as three "qubit pairs":
    pair 0 = qubits 0,1
    pair 1 = qubits 2,3
    pair 2 = qubits 4,5
  Encodes one qubit pair (= 2 logical qubits, called L and S in Knill).

stabilizers:
  - "X_0 X_3 X_4 X_5"
  - "X_0 X_1 X_2 X_5"
  - "Z_0 Z_3 Z_4 Z_5"
  - "Z_0 Z_1 Z_2 Z_5"

x:
  - "X_1 X_2"
  - "X_0 X_2 X_3"
z:
  - "Z_2 Z_3 Z_5"
  - "Z_3 Z_4"
