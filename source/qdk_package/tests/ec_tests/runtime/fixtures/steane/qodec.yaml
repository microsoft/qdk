---
qodec.yaml:
  name: steane
  description: The Steane [[7,1,3]] code — the canonical CSS / color code with a fully transversal Clifford group (transversal H and CNOT) plus a flag-qubit fault-tolerant syndrome round (idle_ft, Chao-Reichardt).
  layers:
  - instruction_set: steane.isa.yaml
    codes:
      steane: steane.code.yaml
    gadgets:
      cnot: cnot.gadget.yaml
      h: h.gadget.yaml
      idle: idle.gadget.yaml
      idle_ft: idle_ft.gadget.yaml
      measure_x: measure_x.gadget.yaml
      measure_z: measure_z.gadget.yaml
      prepare_x: prepare_x.gadget.yaml
      prepare_z: prepare_z.gadget.yaml
  - instruction_set: stim.isa.yaml
---
steane.isa.yaml:
  name: steane
  description: Logical instruction set for the Steane [[7,1,3]] code.
  blocks:
    steane: 1
  instructions:
  - mnemonic: prepare_z
    description: Prepare the logical |0> state.
    out: [steane]
    action:
    - stabilize: [Z_0]
  - mnemonic: prepare_x
    description: Prepare the logical |+> state.
    out: [steane]
    action:
    - stabilize: [X_0]
  - mnemonic: idle
    description: One full syndrome-extraction round (identity logical action).
    in: [steane]
    out: [steane]
  - mnemonic: idle_ft
    description: One fault-tolerant syndrome-extraction round (Chao-Reichardt). Each weight-4 stabilizer is measured with a flag qubit; the six flags herald hook errors.
    in: [steane]
    out: [steane]
    flags: [flag_0, flag_1, flag_2, flag_3, flag_4, flag_5]
  - mnemonic: measure_z
    description: Destructive measurement of the logical Z observable.
    in: [steane]
    action:
    - observe: Z_0
  - mnemonic: measure_x
    description: Destructive measurement of the logical X observable.
    in: [steane]
    action:
    - observe: X_0
  - mnemonic: h
    description: Transversal logical Hadamard.
    in: [steane]
    out: [steane]
    action:
    - clifford:
        X_0: Z_0
        Z_0: X_0
  - mnemonic: cnot
    description: Transversal logical CNOT (control = logical qubit 0, target = logical qubit 1).
    in: [steane, steane]
    out: [steane, steane]
    action:
    - clifford:
        X_0: X_0 X_1
        Z_1: Z_0 Z_1
---
stim.isa.yaml:
  name: stim
  description: 'Canonical Stim-compatible physical ISA: resets, single-qubit Cliffords and Paulis, CX/CZ, destructive plus two-body Pauli measurements, and constant measurement-record padding. Shared by every catalog example as its bottom (physical) layer.'
  blocks:
    qubit: 1
  instructions:
  - mnemonic: I
    description: Identity.
    in: [qubit]
    out: [qubit]
  - mnemonic: R
    description: Reset to |0>.
    out: [qubit]
    action:
    - stabilize: [Z_0]
  - mnemonic: H
    description: Hadamard.
    in: [qubit]
    out: [qubit]
    action:
    - clifford:
        X_0: Z_0
        Z_0: X_0
  - mnemonic: S
    description: Phase gate.
    in: [qubit]
    out: [qubit]
    action:
    - clifford:
        X_0: Y_0
        Z_0: Z_0
  - mnemonic: X
    description: Pauli X.
    in: [qubit]
    out: [qubit]
    action:
    - pauli: X_0
  - mnemonic: Y
    description: Pauli Y.
    in: [qubit]
    out: [qubit]
    action:
    - pauli: Y_0
  - mnemonic: Z
    description: Pauli Z.
    in: [qubit]
    out: [qubit]
    action:
    - pauli: Z_0
  - mnemonic: Z_if
    description: Pauli Z applied only when the supplied classical bit is set — Stim's `CZ rec[-k] q`. A measurement-based preparation uses this to feed its outcome forward, so that the state it produces is definite rather than one of several branches.
    in: [qubit]
    out: [qubit]
    parameters:
      correction: bit
    action:
    - pauli: Z_0
      if: [correction]
  - mnemonic: X_if
    description: Pauli X applied only when the supplied classical bit is set — Stim's `CX rec[-k] q`, and the dual of `Z_if`.
    in: [qubit]
    out: [qubit]
    parameters:
      correction: bit
    action:
    - pauli: X_0
      if: [correction]
  - mnemonic: CX
    description: Controlled-X (CNOT).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - clifford:
        X_0: X_0 X_1
        Z_1: Z_0 Z_1
  - mnemonic: CZ
    description: Controlled-Z.
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - clifford:
        X_0: X_0 Z_1
        X_1: Z_0 X_1
        Z_0: Z_0
        Z_1: Z_1
  - mnemonic: SWAP
    description: Swap two qubits.
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - clifford:
        X_0: X_1
        X_1: X_0
        Z_0: Z_1
        Z_1: Z_0
  - mnemonic: M
    description: Destructive Z-basis measurement.
    in: [qubit]
    action:
    - observe: Z_0
  - mnemonic: MPAD0
    description: Append a constant zero to the measurement record without using qubits.
    action:
    - observe: I
  - mnemonic: MPAD1
    description: Append a constant one to the measurement record without using qubits.
    action:
    - observe: -I
  - mnemonic: MX
    description: Destructive X-basis measurement.
    in: [qubit]
    action:
    - observe: X_0
  - mnemonic: MXX
    description: Two-body XX-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - observe: X_0 X_1
  - mnemonic: MYY
    description: Two-body YY-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - observe: Y_0 Y_1
  - mnemonic: MYY_NEG
    description: Two-body YY measurement with its reported bit inverted; use inline YAML calls.
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - observe: -Y_0 Y_1
  - mnemonic: MZZ
    description: Two-body ZZ-parity measurement (non-destructive).
    in: [qubit, qubit]
    out: [qubit, qubit]
    action:
    - observe: Z_0 Z_1
---
steane.code.yaml:
  name: steane
  description: Steane [[7,1,3]] CSS code from the [7,4,3] Hamming code. Stabilizers 0-2 are X-type, 3-5 are Z-type (same Hamming support). Logical X = X_0…X_6, logical Z = Z_0…Z_6.
  stabilizers: [X_0 X_2 X_4 X_6, X_1 X_2 X_5 X_6, X_3 X_4 X_5 X_6, Z_0 Z_2 Z_4 Z_6, Z_1 Z_2 Z_5 Z_6, Z_3 Z_4 Z_5 Z_6]
  x: [X_0 X_1 X_2 X_3 X_4 X_5 X_6]
  z: [Z_0 Z_1 Z_2 Z_3 Z_4 Z_5 Z_6]
---
cnot.gadget.yaml:
  circuit:
    source: CX 0 7 1 8 2 9 3 10 4 11 5 12 6 13
    format: stim
  checks:
  - ['in[0].stabilizers[0]', 'in[1].stabilizers[0]', 'out[0].stabilizers[0]']
  - ['in[0].stabilizers[1]', 'in[1].stabilizers[1]', 'out[0].stabilizers[1]']
  - ['in[0].stabilizers[2]', 'in[1].stabilizers[2]', 'out[0].stabilizers[2]']
  - ['in[0].stabilizers[3]', 'out[0].stabilizers[3]']
  - ['in[0].stabilizers[4]', 'out[0].stabilizers[4]']
  - ['in[0].stabilizers[5]', 'out[0].stabilizers[5]']
  - ['in[1].stabilizers[0]', 'out[1].stabilizers[0]']
  - ['in[1].stabilizers[1]', 'out[1].stabilizers[1]']
  - ['in[1].stabilizers[2]', 'out[1].stabilizers[2]']
  - ['in[0].stabilizers[3]', 'in[1].stabilizers[3]', 'out[1].stabilizers[3]']
  - ['in[0].stabilizers[4]', 'in[1].stabilizers[4]', 'out[1].stabilizers[4]']
  - ['in[0].stabilizers[5]', 'in[1].stabilizers[5]', 'out[1].stabilizers[5]']
---
h.gadget.yaml:
  circuit:
    source: H 0 1 2 3 4 5 6
    format: stim
  checks:
  - ['in[0].stabilizers[3]', 'out[0].stabilizers[0]']
  - ['in[0].stabilizers[4]', 'out[0].stabilizers[1]']
  - ['in[0].stabilizers[5]', 'out[0].stabilizers[2]']
  - ['in[0].stabilizers[0]', 'out[0].stabilizers[3]']
  - ['in[0].stabilizers[1]', 'out[0].stabilizers[4]']
  - ['in[0].stabilizers[2]', 'out[0].stabilizers[5]']
---
idle.gadget.yaml:
  circuit:
    source: |-
      R 7 8 9 10 11 12
      H 7 8 9
      CX 7 0 7 2 7 4 7 6
      CX 8 1 8 2 8 5 8 6
      CX 9 3 9 4 9 5 9 6
      CX 0 10 2 10 4 10 6 10
      CX 1 11 2 11 5 11 6 11
      CX 3 12 4 12 5 12 6 12
      H 7 8 9
      M 7 8 9 10 11 12
    format: stim
  checks:
  - ['circuit.readouts[0]', 'in[0].stabilizers[0]']
  - ['circuit.readouts[1]', 'in[0].stabilizers[1]']
  - ['circuit.readouts[2]', 'in[0].stabilizers[2]']
  - ['circuit.readouts[3]', 'in[0].stabilizers[3]']
  - ['circuit.readouts[4]', 'in[0].stabilizers[4]']
  - ['circuit.readouts[5]', 'in[0].stabilizers[5]']
  - ['circuit.readouts[0]', 'out[0].stabilizers[0]']
  - ['circuit.readouts[1]', 'out[0].stabilizers[1]']
  - ['circuit.readouts[2]', 'out[0].stabilizers[2]']
  - ['circuit.readouts[3]', 'out[0].stabilizers[3]']
  - ['circuit.readouts[4]', 'out[0].stabilizers[4]']
  - ['circuit.readouts[5]', 'out[0].stabilizers[5]']
---
