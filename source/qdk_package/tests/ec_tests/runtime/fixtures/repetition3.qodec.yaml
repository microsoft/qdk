# repetition3 — single-file qodec bundle.
#
# A qodec may be authored either as a directory of individual artifact files
# or, as here, as one multi-document YAML stream. Each document is a single
# `{relative/path.yaml: body}` envelope; the key is the path the artifact
# would have on disk, and cross-references between artifacts use those same
# paths. The document keyed `qodec.yaml` is the manifest.
---
qodec.yaml:
  name: repetition3
  description: Z-basis bit-flip repetition code (distance 3) — the simplest non-trivial QEC example in qodec.
  layers:
    - instruction_set: repetition3.isa.yaml
      codes:
        repetition3: repetition3.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        idle: idle.gadget.yaml
        m: m.gadget.yaml
        mresetz: mresetz.gadget.yaml
        rz: rz.gadget.yaml
        x: x.gadget.yaml
        y: y.gadget.yaml
        z: z.gadget.yaml
    - instruction_set: stim+rz.isa.yaml
---
repetition3.isa.yaml:
  name: repetition3
  description: Logical instruction set for the 3-qubit bit-flip repetition code.
  blocks: {repetition3: 1}
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [repetition3]
      action: [stabilize: Z_0]
    - mnemonic: idle
      description: One syndrome-extraction round (identity logical action).
      in: [repetition3]
      out: [repetition3]
    - mnemonic: m
      description: Destructive Z-basis measurement of the logical Z observable.
      in: [repetition3]
      action: [observe: Z_0]
    - mnemonic: mresetz
      description: Z-basis measurement of the logical Z observable, then reset to |0>.
      in: [repetition3]
      out: [repetition3]
      action: [observe: Z_0, stabilize: Z_0]
    - mnemonic: rz
      description: Logical Z-axis rotation by theta radians (non-Clifford for generic theta).
      in: [repetition3]
      out: [repetition3]
      parameters: {theta: number}
      action: [rotate: {pauli: Z_0, angle: theta}]
    - mnemonic: x
      description: Logical X.
      in: [repetition3]
      out: [repetition3]
      action: [pauli: X_0]
    - mnemonic: y
      description: Logical Y.
      in: [repetition3]
      out: [repetition3]
      action: [pauli: Y_0]
    - mnemonic: z
      description: Logical Z.
      in: [repetition3]
      out: [repetition3]
      action: [pauli: Z_0]
---
stim+rz.isa.yaml:
  name: stim+rz
  description: Compact stim-like physical ISA plus a parameterized rotate_z(theta).
  blocks: {qubit: 1}
  instructions:
    - mnemonic: R
      description: Reset qubit to |0>.
      out: [qubit]
      action: [stabilize: Z_0]
    - mnemonic: M
      description: Destructive Z-basis measurement.
      in: [qubit]
      action: [observe: Z_0]
    - mnemonic: CX
      description: Controlled-X (CNOT).
      in: [qubit, qubit]
      out: [qubit, qubit]
      action: [clifford: {X_0: X_0 X_1, Z_1: Z_0 Z_1}]
    - mnemonic: X
      description: Pauli X.
      in: [qubit]
      out: [qubit]
      action: [pauli: X_0]
    - mnemonic: Y
      description: Pauli Y.
      in: [qubit]
      out: [qubit]
      action: [pauli: Y_0]
    - mnemonic: Z
      description: Pauli Z.
      in: [qubit]
      out: [qubit]
      action: [pauli: Z_0]
    - mnemonic: rotate_z
      description: Rotation by exp(-i theta/2 Z).
      in: [qubit]
      out: [qubit]
      parameters: {theta: number}
      action: [rotate: {pauli: Z_0, angle: theta}]
---
repetition3.code.yaml:
  name: repetition3
  description: 3-qubit bit-flip repetition code (Z-basis).
  stabilizers: [Z_0 Z_1, Z_1 Z_2]
  x: [X_0 X_1 X_2]
  z: [Z_0]
---
prepare_z.gadget.yaml:
  circuit: {format: stim, source: "R 0 1 2"}
---
idle.gadget.yaml:
  circuit:
    format: stim
    source: |-
      R 3 4
      CX 0 3 1 3
      CX 1 4 2 4
      M 3 4
  checks:
    - ["circuit.readouts[0]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "in[0].stabilizers[1]"]
    - ["circuit.readouts[0]", "out[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "out[0].stabilizers[1]"]
---
m.gadget.yaml:
  circuit: {format: stim, source: "M 0 1 2"}
  checks:
    - ["circuit.readouts[0]", "circuit.readouts[1]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "circuit.readouts[2]", "in[0].stabilizers[1]"]
  readouts: [["circuit.readouts[0]", "in[0].z[0]"]]
---
mresetz.gadget.yaml:
  circuit:
    source: [{M: [0]}, {M: [1]}, {M: [2]}, {R: [0]}, {R: [1]}, {R: [2]}]
  checks:
    - ["circuit.readouts[0]", "circuit.readouts[1]", "in[0].stabilizers[0]"]
    - ["circuit.readouts[1]", "circuit.readouts[2]", "in[0].stabilizers[1]"]
  readouts: [["circuit.readouts[0]", "in[0].z[0]"]]
---
rz.gadget.yaml:
  circuit:
    source: [rotate_z: [0, theta: theta]]
  parameter_bindings: {theta: circuit.source.theta}
---
x.gadget.yaml:
  circuit:
    source: [{X: [0]}, {X: [1]}, {X: [2]}]
---
y.gadget.yaml:
  circuit:
    source: [{Y: [0]}, {X: [1]}, {X: [2]}]
---
z.gadget.yaml:
  circuit:
    source: [{Z: [0]}]
