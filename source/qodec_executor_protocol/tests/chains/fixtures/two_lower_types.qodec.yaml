# two_lower_types: a one-layer qodec whose lower ISA has two block types.
#
# Each logical qubit is a two-qubit repetition code, held by one block of
# type `a` and one of type `b`. Qodec's encoder numbers the lower blocks in
# one label space across their types, so a second logical qubit lowers to
# labels 2 (`a`) and 3 (`b`), though only two blocks of each type are live.
# The `x` gadget passes the Pauli `X`, without a qubit index, which Qodec's
# parser reads as `X_0`, and `-X_0`, whose sign, a global phase, no bit
# shows.
#
# A `single` logical qubit is held by one `b` block, and released without a
# gadget. The lower ISA has no release instruction, so Qodec's encoder
# releases its `b` block lazily: it emits nothing, and gives the block's
# label to the next lower block it prepares, of either type, while the `b`
# block stays live below.
---
qodec.yaml:
  name: two_lower_types
  description: One logical qubit per pair of blocks of two lower types, or per block of one.
  layers:
    - instruction_set: pair.isa.yaml
      codes:
        pair: pair.code.yaml
        single: single.code.yaml
      gadgets:
        prepare_z: prepare_z.gadget.yaml
        prepare_single: prepare_single.gadget.yaml
        x: x.gadget.yaml
        measure_z: measure_z.gadget.yaml
    - instruction_set: two_types.isa.yaml
---
pair.isa.yaml:
  name: pair
  description: One logical qubit per block, of either type.
  blocks: { pair: 1, single: 1 }
  instructions:
    - mnemonic: prepare_z
      description: Prepare the logical |0> state.
      out: [pair]
      action: [stabilize: Z_0]
    - mnemonic: x
      description: Logical X.
      in: [pair]
      out: [pair]
      action: [pauli: X_0]
    - mnemonic: measure_z
      description: Destructive logical Z measurement.
      in: [pair]
      action: [observe: Z_0]
    - mnemonic: prepare_single
      description: Prepare the logical |0> state.
      out: [single]
      action: [stabilize: Z_0]
    - mnemonic: release_single
      description: Release the block.
      in: [single]
---
two_types.isa.yaml:
  name: two_types
  description: Two block types of one qubit each, with the same instructions.
  blocks: { a: 1, b: 1 }
  instructions:
    - mnemonic: prepare_a
      description: Reset to |0>.
      out: [a]
      action: [stabilize: Z_0]
    - mnemonic: prepare_b
      description: Reset to |0>.
      out: [b]
      action: [stabilize: Z_0]
    - mnemonic: pauli_a
      description: Apply a Pauli.
      in: [a]
      out: [a]
      parameters: { p: pauli }
      action: [pauli: p]
    - mnemonic: pauli_b
      description: Apply a Pauli.
      in: [b]
      out: [b]
      parameters: { p: pauli }
      action: [pauli: p]
    - mnemonic: measure_a
      description: Destructive Z measurement.
      in: [a]
      action: [observe: Z_0]
    - mnemonic: measure_b
      description: Destructive Z measurement.
      in: [b]
      action: [observe: Z_0]
---
pair.code.yaml:
  name: pair
  description: Two-qubit bit-flip repetition code.
  stabilizers: [Z_0 Z_1]
  x: [X_0 X_1]
  z: [Z_0]
---
single.code.yaml:
  name: single
  description: One unencoded qubit.
  stabilizers: []
  x: [X_0]
  z: [Z_0]
---
prepare_z.gadget.yaml:
  circuit:
    source:
      - prepare_a: [0]
      - prepare_b: [1]
    out: { "0": a, "1": b }
---
prepare_single.gadget.yaml:
  circuit:
    source:
      - prepare_b: [0]
    out: { "0": b }
---
x.gadget.yaml:
  circuit:
    source:
      - pauli_a: [0, p: X]
      - pauli_b: [1, p: -X_0]
    in: { "0": a, "1": b }
    out: { "0": a, "1": b }
---
measure_z.gadget.yaml:
  circuit:
    source:
      - measure_a: [0]
      - measure_b: [1]
    in: { "0": a, "1": b }
  checks:
    - ["circuit.readouts[0]", "circuit.readouts[1]", "in[0].stabilizers[0]"]
  readouts: [["circuit.readouts[0]", "in[0].z[0]"]]
