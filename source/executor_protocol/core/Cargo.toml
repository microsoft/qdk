[package]
name = "executor_protocol_core"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pins the fields of the crate's hand-written futures without `unsafe`;
# already in the workspace's builds, wasm32 included, through
# futures-util. Why it is needed: the header of `src/composition/part_panics.rs`.
pin-project-lite = { workspace = true }
# A shot set holds one shot inline, with no allocation. `union` lays the
# inline item over the heap pointer with no tag word, which keeps a shot
# set, and so a batch, smaller. Cargo unifies features across the
# workspace, so other crates' small vectors get it too in a shared build.
smallvec = { workspace = true, features = ["union"] }

[lints]
workspace = true

[lib]
doctest = false
bench = false

[[example]]
name = "compose_and_run"
test = true
