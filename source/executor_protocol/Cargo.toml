[package]
name = "executor_protocol"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `union` lays a small vector's inline items over its heap pointer with no
# tag word, which keeps an instruction at 128 bytes rather than 144. Cargo
# unifies features across the workspace, so other crates' small vectors
# get it too in a shared build; smallvec 1.15 and later support it on
# stable Rust.
smallvec = { workspace = true, features = ["union"] }

[lints]
workspace = true

[lib]
doctest = false
bench = false
