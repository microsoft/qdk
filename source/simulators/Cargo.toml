[package]
name = "qdk_simulators"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:futures", "dep:wgpu"]
# The `qir::conformance` module: checks of `QirResumer`'s rules, for
# implementers' tests.
conformance = []

[dependencies]
binar = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
futures = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
rand = { workspace = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
num-bigint = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
qsc_data_structures = { path = "../compiler/qsc_data_structures" }
regex-lite = { workspace = true }
rustc-hash = { workspace = true }
paulimer = { workspace = true }
pauliverse = { workspace = true }
index_map = { path = "../index_map" }
noisy_simulator = { path = "../noisy_simulator" }

[dev-dependencies]
expect-test = { workspace = true }
criterion = { workspace = true }
# The resumers of `tests/resumers/` run the `qir::conformance` checks.
qdk_simulators = { path = ".", features = ["conformance"] }
# The corpus of `tests/run_shot_compatibility` and of the `qir_machine`
# bench, in JSON.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[target.'cfg(target_os="linux")'.dev-dependencies]
gungraun = { workspace = true }

[[bench]]
name = "sim_time"
harness = false

[[bench]]
name = "sim_time_noisy"
harness = false

[[bench]]
name = "sim_mem"
harness = false

[[bench]]
name = "sparse_sim"
harness = false

# A plain binary: it asserts that the runtimes it measures agree, then
# prints their times and ratios.
[[bench]]
name = "qir_machine"
harness = false

[[bin]]
name = "gpu-runner"
path = "src/bin/gpu-runner.rs"
required-features = ["gpu"]
