[package]
name = "qdk_cutensornet"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = { workspace = true }
num-complex = { workspace = true }
tensornet = { path = "../tensornet" }
thiserror = { workspace = true }

[features]
# Exposes the engine without MPS capture and its variants (`EngineVariant`:
# workspace preference, restart period, fresh handle, SVD algorithm, gauge),
# for the A100 qualification only (scripts/qualify-engine-on-a100.sh and
# tensornet_simulator's qualification tests); not a supported configuration.
qualification = []

[dev-dependencies]
tensornet = { path = "../tensornet", features = ["conformance"] }

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "generate-loader"
path = "src/bin/generate-loader.rs"
bench = false
test = false

[[test]]
name = "qualification"
path = "tests/qualification/main.rs"
required-features = ["qualification"]
