version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/.ado/images/copilot-sandbox/agent/copilot"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
