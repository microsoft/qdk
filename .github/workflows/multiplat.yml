name: Multiplatform Build and Test

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22.14.0"
  PYTHON_VERSION: "3.11"
  RUST_TOOLCHAIN_VERSION: "1.95"
  RUST_TOOLCHAIN_COMPONENTS: rustfmt clippy

jobs:
  build-and-test-all-platforms:
    name: Build and Test (All Platforms)
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: "true"
      - name: Setup rust toolchain
        uses: ./.github/actions/toolchains/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: ${{ env.RUST_TOOLCHAIN_COMPONENTS }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Prereqs
        run: python ./prereqs.py --install
      - name:
          Build and Test
          # we use xvfb-run to provide a virtual framebuffer for the VS Code tester,
          # which requires a display to run
        run: xvfb-run -a python ./build.py --integration-tests
        if: runner.os == 'Linux'
      - name: Build and Test
        run: python ./build.py --integration-tests
        if: runner.os != 'Linux'
      - name: File issue on failure
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        id: create-issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url="$(gh issue create \
            --title "CI failure: ${{ matrix.platform }} (${{ github.run_id }})" \
            --body "See the corresponding [**workflow run**](${{ env.WORKFLOW_RUN_URL }}) for failure details, update the issue with any relevant information, and assign to the appropriate team member(s)." \
            --label ci_failure \
            --assignee swernli,idavis,minestarks,billti)"
          number="$(gh issue view "$url" --json number --jq .number)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: "If Fuzzing Failed: Log Issue Info"
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Created issue #${{ steps.create-issue.outputs.number }} ${{ steps.create-issue.outputs.url }}"
