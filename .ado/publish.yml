name: qdk-publish-$(BuildId)

# Run on merges to main to ensure that the latest code
# is always able to be published.
trigger:
  branches:
    include:
      - main

# Run the pipeline every day at 6:00 AM to ensure
# codeql and other governance checks are up-to-date.
schedules:
  - cron: "0 6 * * *"
    displayName: "Build for Component Governance"
    branches:
      include:
        - main
    always: true

variables:
  CARGO_TERM_COLOR: always
  QDK_LIB_OVERRIDE_MICROSOFT_QDK: $(Build.SourcesDirectory)
  RUST_TOOLCHAIN_VERSION: "1.95"
  # CFS requires that we have a .npmrc next to each package.json.  If we set this variable, it will
  # synthesize everything it requires during the pipeline run, leaving our external contributors
  # free to continue using the default npmjs.org registry.
  # (To learn more, search eng.ms for AZURE_ARTIFACTS_FEED.)
  #
  # Caveat: the synthesized .npmrc file doesn't seem to contain the necessary token, so we'll have to
  # use the npmAuthenticate task explicitly.
  AZURE_ARTIFACTS_FEED: https://pkgs.dev.azure.com/ms-azurequantum/AzureQuantum/_packaging/azure-quantum/npm/registry/

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
  containers:
    - container: qdkBuild
      image: ${{ parameters.ACR_SERVER }}/qdk-build:${{ parameters.qdkBuildTag }}
      endpoint: qdkacr

parameters:
  - name: ACR_SERVER
    displayName: Azure Container Registry server
    type: string
    default: "qdkacr-cfgqhwddajdaebhg.azurecr.io"
  - name: qdkBuildTag
    displayName: Tag for the qdk-build container image
    type: string
    default: "latest"
  - name: matrix
    type: object
    default:
      - name: linux_x86_64
        poolName: "Azure-Pipelines-DevTools-GPU"
        imageName: "ubuntu-2204-qdk-gpu"
        os: linux
        arch: x86_64
        envVars:
          QDK_GPU_TESTS: "1"
      - name: mac_x86_64
        poolName: "Azure Pipelines"
        imageName: "macOS-latest" # MacOS-specific Py (Mac is usually quite limited).
        os: macOS
        arch: x86_64
      - name: mac_aarch64
        poolName: "AcesShared"
        os: macOS
        arch: aarch64
        envVars:
          QDK_GPU_TESTS: "1"
      - name: windows_x86_64
        poolName: "Azure-Pipelines-DevTools-GPU"
        imageName: "1es-pt-dsvm-windows-2022" # Win-specific Py + Platform-independent Py.
        os: windows
        arch: x86_64
        envVars:
          QDK_GPU_TESTS: "1"

# variables set by pipeline
# - BASE_IMAGE
# - BUILD_NUMBER
# - BUILD_TYPE
# - cratesIoFeedOverride
# - OwnerPersonalAlias
# - toolchainFeed

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: "Azure-Pipelines-DevTools-EO"
        image: windows-2025
        os: windows
      sbom:
        continueOnError: false
    stages:
      - stage: build
        displayName: Build
        jobs:
          - ${{ each target in parameters.matrix }}:
              - job: Python_${{ target.name }}_job
                pool:
                  name: ${{ target.poolName }}
                  image: ${{ target.imageName }}
                  os: ${{ target.os }}
                  ${{ if eq(target.poolName, 'AcesShared') }}:
                    demands:
                      - ImageOverride -equals ACES_VM_SharedPool_Sequoia
                variables:
                  arch: ${{ target.arch }}
                  additionalRustTargets: ${{ target.additionalRustTargets }}
                  ${{ if target.envVars }}:
                    ${{ each envVar in target.envVars }}:
                      ${{ envVar.key }}: ${{ envVar.value }}
                timeoutInMinutes: 90
                templateContext:
                  # For Linux targets, build in a container image to support the targeted `manylinux` wheels
                  ${{ if eq(target.os, 'linux') }}:
                    authenticatedContainerRegistries:
                      - serviceConnection: qdkacr
                  outputs:
                    - output: pipelineArtifact
                      displayName: "Upload Python Artifacts Mac"
                      condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'))
                      targetPath: $(System.DefaultWorkingDirectory)/target/wheels
                      artifactName: Wheels.Mac.${{ target.arch }}
                    - output: pipelineArtifact
                      displayName: "Upload Python Artifacts Win"
                      condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
                      targetPath: $(System.DefaultWorkingDirectory)/target/wheels
                      artifactName: Wheels.Win.${{ target.arch }}
                    - output: pipelineArtifact
                      displayName: "Upload Python Artifacts Linux"
                      condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
                      targetPath: $(System.DefaultWorkingDirectory)/target/wheels
                      artifactName: Wheels.Linux.${{ target.arch }}
                steps:
                  - task: PipAuthenticate@1
                    displayName: Pip Authenticate
                    inputs:
                      artifactFeeds: "AzureQuantum/azure-quantum"

                  # Build before installing host tools, whose PATH entries can leak into the container.
                  - ${{ if eq(target.os, 'linux') }}:
                      - bash: |
                          set -euo pipefail

                          python3.11 -m venv .venv-manylinux
                          source .venv-manylinux/bin/activate
                          python - <<'PY'
                          import subprocess
                          import sys
                          import tomllib

                          with open("source/qdk_package/pyproject.toml", "rb") as f:
                              requires = tomllib.load(f)["build-system"]["requires"]
                          subprocess.run([sys.executable, "-m", "pip", "install", *requires], check=True)
                          PY

                          export CARGO_HOME="$(pwd)/.cargo-manylinux"
                          mkdir -p "$CARGO_HOME"
                          cat > "$CARGO_HOME/config.toml" <<EOF
                          [source.crates-io]
                          replace-with = "ms-crates-io"

                          [source.ms-crates-io]
                          registry = "$(cratesIoFeedOverride)"
                          EOF

                          rustc --version
                          python ./version.py
                          maturin build \
                            --manifest-path source/qdk_package/Cargo.toml \
                            --release \
                            --interpreter python3.11 \
                            --compatibility manylinux_2_28 \
                            --auditwheel check \
                            --out target/wheels
                        displayName: Build manylinux_2_28 wheel
                        target: qdkBuild
                        env:
                          PIP_INDEX_URL: $(PIP_INDEX_URL)
                          CARGO_REGISTRIES_MS_CRATES_IO_INDEX: $(cratesIoFeedOverride)
                          CARGO_REGISTRIES_MS_CRATES_IO_TOKEN: Bearer $(System.AccessToken)
                          CARGO_REGISTRIES_MS_CRATES_IO_CREDENTIAL_PROVIDER: cargo:token

                  - ${{ if ne(target.os, 'linux') }}:
                      - task: RustInstaller@1
                        inputs:
                          rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
                          additionalTargets: wasm32-unknown-unknown
                          cratesIoFeedOverride: $(cratesIoFeedOverride)
                          toolchainFeed: $(toolchainFeed)
                        displayName: Install Rust toolchain

                      - script: |
                          rustc --version
                          rustc --print target-list
                        displayName: View rust target info

                  - task: UsePythonVersion@0
                    inputs:
                      versionSpec: "3.11"
                      githubToken: "$(GH_PACKAGE_READ_TOKEN)"
                      ${{ if eq(target.arch, 'aarch64') }}:
                        architecture: "arm64"

                  - task: UseNode@1
                    inputs:
                      version: "22.x"

                  - template: /.ado/templates/create-authenticated-npmrc.yml@self

                  - script: |
                      python ./prereqs.py --skip-wasm
                    displayName: Install Prereqs
                    condition: and(ne(variables['Agent.OS'], 'Linux'), ne(variables['arch'], 'aarch64'))

                  - script: |
                      python ./version.py
                    displayName: Set version
                    condition: and(succeeded(), ne(variables['Agent.OS'], 'Linux'))

                  # Windows x86_64 and macOS: build the wheel only. Linux builds it in the container above.
                  - script: |
                      python build.py --qdk --no-check --no-test --no-check-prereqs
                    displayName: Build Platform-Dependent Py Packages (Other)
                    condition: and(succeeded(), ne(variables['Agent.OS'], 'Linux'))

                  - script: |
                      python .ado/scripts/time_stim_tests.py --runs 1
                    displayName: Time stim differential tests
                    condition: succeeded()
                    env:
                      PYTEST_ADDOPTS: "--durations=0 --durations-min=0"

                  - script: |
                      dir target\wheels\*
                    displayName: List Py Packages on Win
                    condition: eq(variables['Agent.OS'], 'Windows_NT')

                  - script: |
                      ls target/wheels/*
                    displayName: List Py Packages on non-Win
                    condition: ne(variables['Agent.OS'], 'Windows_NT')

