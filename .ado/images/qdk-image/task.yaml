version: v1.1.0

steps:
  - build: --build-arg BASE_REGISTRY=$Registry -t $Registry/qdk-image:{{.Values.imageTag}}-{{.Values.arch}} -f Dockerfile .
    timeout: 7200
  - cmd: >
      $Registry/qdk-image:{{.Values.imageTag}}-{{.Values.arch}}
      bash -c 'test "$(uname -m)" = "{{.Values.machine}}"'
  - push:
      - $Registry/qdk-image:{{.Values.imageTag}}-{{.Values.arch}}
